# 集中采集节点；只向宿主回环地址提供运营桌面。
services:
  wx-collector:
    image: deepquest-wx-collector:linux-amd64-20261027
    profiles: [cloud-wechat]
    hostname: deepquest-wx-collector
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Asia/Shanghai
      RESOLUTION: 1280x800x24
      WX_VIDEO_AUTOSTART: 'true'
      WECHAT_AUTOSTART: 'true'
      WX_VIDEO_RUN_AS_ROOT: 'false'
    ports: ['127.0.0.1:6300:3000']
    expose: ['2022']
    volumes:
      - ./docker/volumes/wx-collector:/config
    networks: [app-network]
    restart: unless-stopped
    shm_size: 512m
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 1.25
    cpu_shares: 128
    pids_limit: 768
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:2022/api/mcp/status',timeout=3))['data']['enabled']"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 4
