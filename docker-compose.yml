services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      EQUIPMENT_DR_API_KEY: ${EQUIPMENT_DR_API_KEY:-}
      EQUIPMENT_DR_APP_DB: sqlite:////app/outputs/application.db
      EQUIPMENT_DR_MODE: ${EQUIPMENT_DR_MODE:-fake}
      EQUIPMENT_DR_PROVIDER: ${EQUIPMENT_DR_PROVIDER:-codex}
      EQUIPMENT_DR_MODEL: ${EQUIPMENT_DR_MODEL:-gpt-5.5}
      EQUIPMENT_DR_CODEX_COMMAND: ${EQUIPMENT_DR_CODEX_COMMAND:-codex}
      EQUIPMENT_DR_CODEX_HOME: ${EQUIPMENT_DR_CODEX_HOME:-}
      EQUIPMENT_DR_CODEX_SOURCE_HOME: ${EQUIPMENT_DR_CODEX_SOURCE_HOME:-}
      EQUIPMENT_DR_CODEX_INHERIT_CONFIG: ${EQUIPMENT_DR_CODEX_INHERIT_CONFIG:-0}
      EQUIPMENT_DR_CODEX_BASE_URL: ${EQUIPMENT_DR_CODEX_BASE_URL:-https://api.openai.com/v1}
      EQUIPMENT_DR_CODEX_API_KEY_ENV: ${EQUIPMENT_DR_CODEX_API_KEY_ENV:-EQUIPMENT_DR_CODEX_API_KEY}
      EQUIPMENT_DR_CODEX_API_KEY: ${EQUIPMENT_DR_CODEX_API_KEY:-}
      EQUIPMENT_DR_BASE_URL: ${EQUIPMENT_DR_BASE_URL:-https://api.openai.com/v1/responses}
      EQUIPMENT_DR_API_KEY_ENV: ${EQUIPMENT_DR_API_KEY_ENV:-EQUIPMENT_DR_API_KEY}
      EQUIPMENT_DR_AGENT_MODELS_JSON: ${EQUIPMENT_DR_AGENT_MODELS_JSON:-{}}
      EQUIPMENT_DR_ALLOW_BENCHMARK_DNS_PROXY: ${EQUIPMENT_DR_ALLOW_BENCHMARK_DNS_PROXY:-0}
      EQUIPMENT_DR_ENABLE_ABLATION: ${EQUIPMENT_DR_ENABLE_ABLATION:-1}
      EQUIPMENT_DR_RESEARCH_WORKER_CONCURRENCY: ${EQUIPMENT_DR_RESEARCH_WORKER_CONCURRENCY:-4}
      EQUIPMENT_EVAL_ZHIPU_BASE_URL: ${EQUIPMENT_EVAL_ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      EQUIPMENT_EVAL_ZHIPU_API_KEY: ${EQUIPMENT_EVAL_ZHIPU_API_KEY:-}
    volumes:
      - research-data:/app/outputs
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "equipment_deep_research.interfaces.worker", "--project-root", "/app", "--output-root", "/app/outputs/runs"]
    environment:
      EQUIPMENT_DR_API_KEY: ${EQUIPMENT_DR_API_KEY:-}
      EQUIPMENT_DR_APP_DB: sqlite:////app/outputs/application.db
      EQUIPMENT_DR_MODE: ${EQUIPMENT_DR_MODE:-fake}
      EQUIPMENT_DR_PROVIDER: ${EQUIPMENT_DR_PROVIDER:-codex}
      EQUIPMENT_DR_MODEL: ${EQUIPMENT_DR_MODEL:-gpt-5.5}
      EQUIPMENT_DR_CODEX_COMMAND: ${EQUIPMENT_DR_CODEX_COMMAND:-codex}
      EQUIPMENT_DR_CODEX_HOME: ${EQUIPMENT_DR_CODEX_HOME:-}
      EQUIPMENT_DR_CODEX_SOURCE_HOME: ${EQUIPMENT_DR_CODEX_SOURCE_HOME:-}
      EQUIPMENT_DR_CODEX_INHERIT_CONFIG: ${EQUIPMENT_DR_CODEX_INHERIT_CONFIG:-0}
      EQUIPMENT_DR_CODEX_BASE_URL: ${EQUIPMENT_DR_CODEX_BASE_URL:-https://api.openai.com/v1}
      EQUIPMENT_DR_CODEX_API_KEY_ENV: ${EQUIPMENT_DR_CODEX_API_KEY_ENV:-EQUIPMENT_DR_CODEX_API_KEY}
      EQUIPMENT_DR_CODEX_API_KEY: ${EQUIPMENT_DR_CODEX_API_KEY:-}
      EQUIPMENT_DR_BASE_URL: ${EQUIPMENT_DR_BASE_URL:-https://api.openai.com/v1/responses}
      EQUIPMENT_DR_API_KEY_ENV: ${EQUIPMENT_DR_API_KEY_ENV:-EQUIPMENT_DR_API_KEY}
      EQUIPMENT_DR_AGENT_MODELS_JSON: ${EQUIPMENT_DR_AGENT_MODELS_JSON:-{}}
      EQUIPMENT_DR_ALLOW_BENCHMARK_DNS_PROXY: ${EQUIPMENT_DR_ALLOW_BENCHMARK_DNS_PROXY:-0}
      EQUIPMENT_DR_RESEARCH_WORKER_CONCURRENCY: ${EQUIPMENT_DR_RESEARCH_WORKER_CONCURRENCY:-4}
    volumes:
      - research-data:/app/outputs
      - ${HOME}/.codex:/root/.codex:ro
    depends_on: [api]
    restart: unless-stopped
    deploy:
      replicas: ${EQUIPMENT_DR_RESEARCH_WORKER_CONCURRENCY:-4}
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on: [api]
    ports: ["8080:80"]
    restart: unless-stopped
volumes:
  research-data:
