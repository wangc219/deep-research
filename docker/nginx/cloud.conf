# 安装到宿主 /etc/nginx/sites-available/deepquest，证书由 Certbot webroot 续期。
server {
    listen 80 default_server;
    server_name www.deepquest.space 49.232.128.56;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://www.deepquest.space$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.deepquest.space;
    ssl_certificate /etc/letsencrypt/live/www.deepquest.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deepquest.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:deepquest_tls:10m;
    client_max_body_size 128m;

    # 压缩静态脚本和 JSON；text/event-stream 不在压缩类型中，保留实时事件。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml;
    if (-f /var/www/deepquest.maintenance) {
        return 503;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 公网边界覆盖客户端自带 XFF，避免伪造首段 IP 绕过登录限速。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /api/knowledge/wxchannels/collector/audio {
        client_max_body_size 256m;
        proxy_pass http://127.0.0.1:6050;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:6050;
    }
    location / {
        proxy_buffering on;
        proxy_pass http://127.0.0.1:8088;
    }
}
