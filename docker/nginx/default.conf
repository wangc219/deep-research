server {
    listen 80;
    server_name localhost;

    # Docker 服务容器可能在独立升级、崩溃恢复后获得新 IP。通过内置 DNS
    # 按请求重新解析，避免静态入口继续向旧地址代理并永久返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:5050;
    set $minio_backend minio:9000;

    # 后端知识库/工作区允许单文件 100 MiB；保留 multipart 开销，避免静态入口提前 413。
    client_max_body_size 128M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://$minio_backend;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }
}
