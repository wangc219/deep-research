# 可选静态入口覆盖层；路径以第一个根 Compose 文件为准。
# docker compose -f compose.yaml -f docker/document-research/compose.yaml build document-research web
# docker compose -f compose.yaml -f docker/document-research/compose.yaml run --rm --no-deps document-research init
# docker compose -f compose.yaml -f docker/document-research/compose.yaml up -d document-research web
# 只验收独立模块时最后一条加 --no-deps，避免启动原平台业务服务。
services:
  document-websearch:
    image: ${OPEN_WEBSEARCH_IMAGE:-ghcr.io/aas-ee/open-web-search@sha256:748f1d083c9930db8e8b5f017834e1efa9ec77844dbed01baef2acf3ad47e81a}
    command: ["node", "build/index.js", "serve", "--host", "0.0.0.0", "--port", "3210"]
    environment:
      DEFAULT_SEARCH_ENGINE: bing
      ALLOWED_SEARCH_ENGINES: bing,startpage,sogou,duckduckgo,baidu
      SEARCH_MODE: request
      USE_PROXY: ${OPEN_WEBSEARCH_USE_PROXY:-false}
      PROXY_URL: ${OPEN_WEBSEARCH_PROXY_URL:-http://host.docker.internal:7890}
      OPEN_WEBSEARCH_QUIET_STARTUP: "true"
    networks: [document-research-network]
    expose: ["3210"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  document-research:
    build:
      context: .
      dockerfile: docker/document-research/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-document-research:local
    user: "1000:1000"
    environment:
      DOCUMENT_RESEARCH_WEBSEARCH_URL: http://document-websearch:3210
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - document-research-data:/var/lib/document-research
    networks:
      - document-research-network
    expose: ["4198"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4198/document-research-api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      target: production
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-web-document-research:local
    volumes: !override
      - ./docker/document-research/nginx-location.conf:/etc/nginx/document-research.d/service.conf:ro
    ports: !override
      - "127.0.0.1:${DEEP_RESEARCH_WEB_PORT:-5173}:80"
    networks:
      - app-network
      - document-research-network
    environment:
      NODE_ENV: production
    command: ["nginx", "-g", "daemon off;"]

volumes:
  document-research-data:

networks:
  document-research-network:
    driver: bridge
