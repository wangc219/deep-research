name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: PYTHONPATH=src python -m compileall -q src
      - name: Check architecture boundaries
        run: PYTHONPATH=src python -m equipment_deep_research.architecture
      - name: Run Python tests
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            summary="$(tail -80 pytest.log | tr '\\n' ' ' | cut -c1-6000)"
            echo "::error file=.github/workflows/quality.yml,line=32,title=pytest failure::$summary"
          fi
          exit "$status"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build workbench
        run: npm run build
