server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Compress JSON, JavaScript and CSS before they cross the public tunnel.
  # This matters most for the task list and the first artifact payload.
  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ~* \.(?:js|css|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri /index.html;
  }

  location / { try_files $uri /index.html; }
}
