name: ${COMPOSE_PROJECT_NAME:-equipmentresearch3}

x-api-worker-env: &api-worker-env
  HOST_IP: ${HOST_IP:-}
  RUNNING_IN_DOCKER: "true"
  UV_COMPILE_BYTECODE: "0"
  DEEP_RESEARCH_ENV: production
  EQUIPMENT_DR_PROJECT_ROOT: /app
  EQUIPMENT_DR_OUTPUT_ROOT: /app/outputs/runs
  EQUIPMENT_DR_APP_DB: sqlite:////app/outputs/application.db
  EQUIPMENT_DR_QUERY_LIBRARY_DB: sqlite:////app/outputs/query-library.db
  PLATFORM_MODEL_CALL_OUTBOX_PATH: /app/outputs/model-call-outbox.db
  EQUIPMENT_DR_MODE: ${EQUIPMENT_DR_MODE:-real}
  PYTHONPATH: /app/package
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.prod}
  API_KEY_DERIVATION_SECRET: ${API_KEY_DERIVATION_SECRET:?Set API_KEY_DERIVATION_SECRET in .env.prod}
  RAPIDOCR_MODEL_DIR: /home/platform/.cache/rapidocr/models
  DEEP_RESEARCH_INSTANCE_ID: ${DEEP_RESEARCH_INSTANCE_ID:?Set DEEP_RESEARCH_INSTANCE_ID in .env.prod}
  POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-deep_research}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
  RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
  READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
  READINESS_CACHE_TTL_SECONDS: ${READINESS_CACHE_TTL_SECONDS:-1}
  DEEP_RESEARCH_CORS_ORIGINS: ${DEEP_RESEARCH_CORS_ORIGINS:-}
  NEO4J_URI: ${NEO4J_URI:-bolt://graph:7687}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.prod}
  MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
  PADDLEX_URI: ${PADDLEX_URI:-http://paddlex:8080}
  MINIO_URI: ${MINIO_URI:-http://minio:9000}
  SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-provisioner}
  SANDBOX_PROVISIONER_URL: ${SANDBOX_PROVISIONER_URL:-http://sandbox-provisioner:8002}
  SANDBOX_PROVISIONER_TOKEN: ${SANDBOX_PROVISIONER_TOKEN:?Set SANDBOX_PROVISIONER_TOKEN in .env.prod}
  SANDBOX_PROVISIONER_DELETE_TIMEOUT_SECONDS: ${SANDBOX_PROVISIONER_DELETE_TIMEOUT_SECONDS:-120}
  SANDBOX_VIRTUAL_PATH_PREFIX: ${SANDBOX_VIRTUAL_PATH_PREFIX:-/home/gem/user-data}
  SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
  SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
  TASKER_DEFAULT_TIMEOUT_SECONDS: ${TASKER_DEFAULT_TIMEOUT_SECONDS:-21600}
  DEEP_RESEARCH_DATASET_PERSIST_BATCH_SIZE: ${DEEP_RESEARCH_DATASET_PERSIST_BATCH_SIZE:-1}
  DEEP_RESEARCH_SKILL_DATA_DIR: /app/skill-sources
  DEEP_RESEARCH_SKILL_PROJECTION_DIR: /app/skill-projections
  WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-open-websearch}
  OPEN_WEBSEARCH_URL: ${OPEN_WEBSEARCH_URL:-http://open-websearch:3210}
  OPEN_WEBSEARCH_ENGINES: ${OPEN_WEBSEARCH_ENGINES:-bing,duckduckgo}
  OPEN_WEBSEARCH_TIMEOUT_SECONDS: ${OPEN_WEBSEARCH_TIMEOUT_SECONDS:-15}
  NO_PROXY: localhost,127.0.0.1,milvus,graph,minio,etcd,mineru,paddlex,sandbox-provisioner,open-websearch,api.siliconflow.cn
  no_proxy: localhost,127.0.0.1,milvus,graph,minio,etcd,mineru,paddlex,sandbox-provisioner,open-websearch,api.siliconflow.cn

services:
  open-websearch:
    image: ${OPEN_WEBSEARCH_IMAGE:-ghcr.io/aas-ee/open-web-search@sha256:748f1d083c9930db8e8b5f017834e1efa9ec77844dbed01baef2acf3ad47e81a}
    command: ["node", "build/index.js", "serve", "--host", "0.0.0.0", "--port", "3210"]
    environment:
      DEFAULT_SEARCH_ENGINE: ${OPEN_WEBSEARCH_DEFAULT_ENGINE:-bing}
      ALLOWED_SEARCH_ENGINES: ${OPEN_WEBSEARCH_ALLOWED_ENGINES:-bing,startpage,sogou,duckduckgo,baidu}
      SEARCH_MODE: request
      USE_PROXY: ${OPEN_WEBSEARCH_USE_PROXY:-false}
      PROXY_URL: ${OPEN_WEBSEARCH_PROXY_URL:-http://host.docker.internal:7890}
      OPEN_WEBSEARCH_QUIET_STARTUP: "true"
    expose:
      - "3210"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/status').then(r=>r.json()).then(x=>{if(x.status!=='ok'||x.data?.runtime!=='ready'||!x.data?.capabilities?.includes('search'))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    ports:
      - "${DEEP_RESEARCH_API_PORT:-6050}:5050"
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-api:${DEEP_RESEARCH_VERSION:-0.7.3}
    working_dir: /app
    user: "1000:1000"
    networks:
      - app-network
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/threads:/app/user-data
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/skill-sources:/app/skill-sources
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/skill-projections:/app/skill-projections
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${DEEP_RESEARCH_ENV_FILE:-.env.prod}
    # region api_envs
    environment:
      <<: *api-worker-env
      DEEP_RESEARCH_RUNTIME_DIR: /app/runtime/api
      DEEP_RESEARCH_USER_DATA_DIR: /app/user-data
      POSTGRES_POOL_SIZE: ${API_POSTGRES_POOL_SIZE:-120}
      POSTGRES_MAX_OVERFLOW: ${API_POSTGRES_MAX_OVERFLOW:-40}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${API_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${API_LANGGRAPH_POSTGRES_POOL_SIZE:-10}
      LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS: ${API_LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      REDIS_MAX_CONNECTIONS: ${API_REDIS_MAX_CONNECTIONS:-256}
    # endregion api_envs
    command: python -m uvicorn server.main:app --host 0.0.0.0 --port 5050
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/api/system/ready || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    depends_on:
      open-websearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      sandbox-provisioner:
        condition: service_healthy
      storage-migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-api:${DEEP_RESEARCH_VERSION:-0.7.3}
    working_dir: /app
    user: "1000:1000"
    networks:
      - app-network
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/threads:/app/user-data
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/skill-sources:/app/skill-sources
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/skill-projections:/app/skill-projections
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${DEEP_RESEARCH_ENV_FILE:-.env.prod}
    environment:
      <<: *api-worker-env
      DEEP_RESEARCH_RUNTIME_DIR: /app/runtime/worker
      DEEP_RESEARCH_USER_DATA_DIR: /app/user-data
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-140}
      REDIS_MAX_CONNECTIONS: ${WORKER_REDIS_MAX_CONNECTIONS:-256}
      POSTGRES_POOL_SIZE: ${WORKER_POSTGRES_POOL_SIZE:-120}
      POSTGRES_MAX_OVERFLOW: ${WORKER_POSTGRES_MAX_OVERFLOW:-40}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${WORKER_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${WORKER_LANGGRAPH_POSTGRES_POOL_SIZE:-120}
      LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS: ${WORKER_LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
    command: python -m server.worker_main
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "arq", "--check", "server.worker_main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s
    depends_on:
      open-websearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox-provisioner:
        condition: service_healthy
      storage-migrator:
        condition: service_completed_successfully

  equipment-worker:
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-api:${DEEP_RESEARCH_VERSION:-0.7.3}
    working_dir: /app
    user: "1000:1000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/threads:/app/user-data
    env_file:
      - ${DEEP_RESEARCH_ENV_FILE:-.env.prod}
    environment:
      <<: *api-worker-env
      DEEP_RESEARCH_USER_DATA_DIR: /app/user-data
    command: python -m platform_core.services.equipment_worker_entry research --project-root /app --output-root /app/outputs/runs
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  equipment-query-worker:
    extends:
      service: equipment-worker
    command: python -m platform_core.services.equipment_worker_entry query worker --poll-interval 1

  storage-migrator:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-api:${DEEP_RESEARCH_VERSION:-0.7.3}
    working_dir: /app
    user: "0:0"
    networks:
      - app-network
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform:/app/legacy-saves
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/threads:/app/user-data
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/skill-sources:/app/skill-sources
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/skill-projections:/app/skill-projections
    env_file:
      - ${DEEP_RESEARCH_ENV_FILE:-.env.prod}
    environment:
      <<: *api-worker-env
      DEEP_RESEARCH_RUNTIME_DIR: /app/runtime/storage-migrator
      DEEP_RESEARCH_LEGACY_STORAGE_DIR: /app/legacy-saves
      DEEP_RESEARCH_USER_DATA_DIR: /app/user-data
    command: python -m platform_core.storage_migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-provisioner:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_SANDBOX_PORT:-9002}:8002"
    build:
      context: ./docker/sandbox_provisioner
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-sandbox-provisioner:${DEEP_RESEARCH_VERSION:-0.7.3}
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/threads:/app/user-data
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/platform/skill-projections:/app/skill-projections
      - ${SANDBOX_ENV_FILE:-./docker/sandbox_provisioner/sandbox.env}:/app/sandbox.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      app-network:
        # 动态接入沙盒网络时保留管理端口的默认路由。
        gw_priority: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Common provisioner settings
      - PROVISIONER_BACKEND=${SANDBOX_PROVISIONER_BACKEND:-docker}
      - PROVISIONER_PUBLIC_URL=${SANDBOX_PROVISIONER_URL:-http://sandbox-provisioner:8002}
      - SANDBOX_PROVISIONER_TOKEN=${SANDBOX_PROVISIONER_TOKEN:?Set SANDBOX_PROVISIONER_TOKEN in .env.prod}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0}
      - SANDBOX_RUNTIME_PROFILE=${SANDBOX_RUNTIME_PROFILE:-core}
      - SANDBOX_CONTAINER_PORT=${SANDBOX_CONTAINER_PORT:-8080}
      - MEMORY_SANDBOX_URL_TEMPLATE=${MEMORY_SANDBOX_URL_TEMPLATE:-http://agent-sandbox:8000}
      - SANDBOX_HEALTH_TIMEOUT_SECONDS=${SANDBOX_HEALTH_TIMEOUT_SECONDS:-300}
      - SANDBOX_IDLE_TIMEOUT_SECONDS=${SANDBOX_IDLE_TIMEOUT_SECONDS:-120}
      - SANDBOX_IDLE_CHECK_INTERVAL_SECONDS=${SANDBOX_IDLE_CHECK_INTERVAL_SECONDS:-10}
      - SANDBOX_EXEC_TIMEOUT_SECONDS=${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
      - SANDBOX_DELETE_CONCURRENCY=${SANDBOX_DELETE_CONCURRENCY:-32}
      - SANDBOX_CONTAINER_STOP_TIMEOUT_SECONDS=${SANDBOX_CONTAINER_STOP_TIMEOUT_SECONDS:-2}
      # Optional proxy for sandbox-provisioner container
      - HTTP_PROXY=${SANDBOX_HTTP_PROXY:-}
      - HTTPS_PROXY=${SANDBOX_HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
      # Docker backend only
      - DOCKER_NETWORK_PREFIX=${SANDBOX_DOCKER_NETWORK_PREFIX:-${COMPOSE_PROJECT_NAME:-deep-research}-sandbox}
      - DOCKER_ADDRESS_POOL=${SANDBOX_DOCKER_ADDRESS_POOL:-10.253.240.0/20}
      - DOCKER_SUBNET_PREFIX=${SANDBOX_DOCKER_SUBNET_PREFIX:-28}
      - DOCKER_USER_DATA_HOST_PATH=${SANDBOX_DOCKER_USER_DATA_HOST_PATH:-}
      - DOCKER_SKILL_PROJECTIONS_HOST_PATH=${SANDBOX_DOCKER_SKILL_PROJECTIONS_HOST_PATH:-}
      - DOCKER_SANDBOX_PREFIX=${SANDBOX_DOCKER_SANDBOX_PREFIX:-${COMPOSE_PROJECT_NAME:-deep-research}-sandbox}
      # Kubernetes backend only
      - K8S_NAMESPACE=${SANDBOX_K8S_NAMESPACE:-deep-research}
      - NODE_HOST=${SANDBOX_NODE_HOST:-host.docker.internal}
      - KUBECONFIG_PATH=${KUBECONFIG_PATH:-}
      - USER_DATA_PVC=${USER_DATA_PVC:-deep-research-user-data}
      - SKILLS_PVC=${SKILLS_PVC:-deep-research-skills}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    depends_on:
      storage-migrator:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-web:${DEEP_RESEARCH_VERSION:-0.7.3}
    ports:
      - "${DEEP_RESEARCH_WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - app-network
    environment:
      - NODE_ENV=production
    command: nginx -g "daemon off;"
    restart: unless-stopped

  graph:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_NEO4J_HTTP_PORT:-8474}:7474"
      - "127.0.0.1:${DEEP_RESEARCH_NEO4J_BOLT_PORT:-8687}:7687"
    image: neo4j:5.26.29
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/neo4j/data:/data
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.prod}
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - ENTITY_EMBEDDING=true
    networks:
      - app-network
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  minio:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_MINIO_API_PORT:-10000}:9000"
      - "127.0.0.1:${DEEP_RESEARCH_MINIO_CONSOLE_PORT:-10001}:9001"
    image: quay.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.prod}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.prod}
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/milvus/minio:/data
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/milvus/minio_config:/root/.minio
    command: minio server /data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  milvus:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_MILVUS_PORT:-20530}:19530"
      - "127.0.0.1:${DEEP_RESEARCH_MILVUS_HEALTH_PORT:-10091}:9091"
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.prod}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.prod}
      MILVUS_LOG_LEVEL: error
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/milvus/milvus:/var/lib/milvus
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/milvus/logs:/var/lib/milvus/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 60s
      start_period: 120s
      timeout: 30s
      retries: 5
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_POSTGRES_PORT:-6432}:5432"
    image: postgres:16
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-600}"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      - POSTGRES_DB=${POSTGRES_DB:-deep_research}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deep_research} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app-network
    restart: unless-stopped

  redis:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_REDIS_PORT:-7379}:6379"
    image: redis:7.4.10-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/redis:/data
    networks:
      - app-network
    restart: unless-stopped

  mineru-api:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_MINERU_PORT:-30001}:30001"
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-mineru:latest
    profiles:
      - all
    env_file:
      - ${DEEP_RESEARCH_ENV_FILE:-.env.prod}
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 30001
      # --allow-public-http-client  # Disabled by default; when binding to 0.0.0.0 or ::, this re-enables *-http-client backends and server_url. Enable only if you accept the SSRF risk.
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30001/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

  paddlex:
    ports:
      - "127.0.0.1:${DEEP_RESEARCH_PADDLEX_PORT:-8080}:8080"
    build:
      context: .
      dockerfile: docker/paddlex.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-deep-research}-paddlex:latest
    profiles:
      - all
    volumes:
      - ${DEEP_RESEARCH_STATE_DIR:-./docker/volumes}/paddlex:/paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
