# 腾讯云基础配置：在 compose.prod.yaml 上叠加，公网入口由宿主 Nginx/TLS 提供。
# 4 核 / 8 GB 使用基础档位；扩容档位见 configs/cloud/ 与 docs/CLOUD_CAPACITY.md。
x-cloud-task-env: &cloud-task-env
  EQUIPMENT_RESEARCH_MAX_RUNNING: ${CLOUD_RESEARCH_MAX_RUNNING:-6}
  EQUIPMENT_QUERY_MAX_RUNNING: ${CLOUD_QUERY_MAX_RUNNING:-4}
  EQUIPMENT_DEEP_MAX_RUNNING: ${CLOUD_DEEP_MAX_RUNNING:-8}
  DURABLE_TASK_MAX_RUNNING: ${CLOUD_DURABLE_MAX_RUNNING:-12}
  AGENT_RUN_SPLIT_QUEUES: ${CLOUD_SPLIT_AGENT_QUEUES:-false}
  AGENT_USER_CHAT_MAX_RUNNING: ${CLOUD_USER_CHAT_MAX_RUNNING:-2}
  AGENT_USER_DEEP_MAX_RUNNING: ${CLOUD_USER_DEEP_MAX_RUNNING:-1}
  # auto/0 不设置每用户固定子 Agent 数；实际并发由 subagent worker 空闲槽、
  # PostgreSQL/模型供应商背压、费用账本与运行取消共同收敛。
  AGENT_USER_SUBAGENT_MAX_RUNNING: ${CLOUD_USER_SUBAGENT_MAX_RUNNING:-auto}
  AGENT_ADAPTIVE_TOOL_PARALLELISM: ${CLOUD_ADAPTIVE_TOOL_PARALLELISM:-true}
  RESOURCE_GOVERNOR_ENABLED: ${CLOUD_RESOURCE_GOVERNOR_ENABLED:-false}
  RESOURCE_BUDGET_PATH: /app/outputs/runtime/resource-budget.json

# API、后台 Worker 与各 Agent Worker 共用同一镜像和完全相同的构建参数。
# BuildKit 因此只执行一条构建图，避免同一次部署重复安装 ASR/Playwright。
x-cloud-api-build: &cloud-api-build
  context: .
  dockerfile: docker/api.Dockerfile
  # 缓存独立于镜像标签持久保存在宿主机。cloud.sh 每次成功构建后原子轮换
  # current/next，避免腾讯镜像代理把本地镜像缓存误当远端 Registry 拉取。
  cache_from:
    - type=local,src=${CLOUD_BUILDKIT_CACHE_FROM:-/var/cache/deepquest-buildkit/api/current}
  cache_to:
    - type=local,dest=${CLOUD_BUILDKIT_CACHE_TO:-/var/cache/deepquest-buildkit/api/next},mode=max
  args:
    GOPROXY: ${CLOUD_GOPROXY:-https://goproxy.cn,direct}
    UV_PYTHON_INSTALL_MIRROR: ${CLOUD_UV_PYTHON_INSTALL_MIRROR:-https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone}
    VIDEO_PIP_INDEX_URL: ${CLOUD_VIDEO_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    # 中国云主机直连 PyTorch 官方 wheel 源通常只有几十 KB/s；默认使用提供相同
    # CPU wheel 与哈希的国内镜像。非中国部署仍可通过环境变量切回官方源。
    VIDEO_TORCH_INDEX_URL: ${CLOUD_VIDEO_TORCH_INDEX_URL:-https://mirror.sjtu.edu.cn/pytorch-wheels/cpu}
    WECHAT_MP_PIP_INDEX_URL: ${CLOUD_WECHAT_MP_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    PLAYWRIGHT_DOWNLOAD_HOST: ${CLOUD_PLAYWRIGHT_DOWNLOAD_HOST:-https://npmmirror.com/mirrors/playwright}

services:
  api:
    cpu_shares: 1024
    # 4 核云机以两个 API 进程服务并发页面，其余核心留给采集、识别与数据库。
    command: ["sh", "-c", "python -m server.wait_dependencies && exec python -m uvicorn server.main:app --host 0.0.0.0 --port 5050 --workers $${API_WEB_CONCURRENCY}"]
    build: *cloud-api-build
    environment:
      <<: *cloud-task-env
      API_WEB_CONCURRENCY: ${CLOUD_API_WORKERS:-2}
      POSTGRES_POOL_SIZE: ${CLOUD_API_POSTGRES_POOL_SIZE:-8}
      POSTGRES_MAX_OVERFLOW: ${CLOUD_API_POSTGRES_MAX_OVERFLOW:-4}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${CLOUD_API_LANGGRAPH_POOL_SIZE:-4}
      REDIS_MAX_CONNECTIONS: ${CLOUD_API_REDIS_MAX_CONNECTIONS:-64}
    ulimits:
      nofile:
        soft: 8192
        hard: 65536
    ports: !override
      - "127.0.0.1:6050:5050"
  worker:
    cpu_shares: 512
    build: *cloud-api-build
    command: ["sh", "-c", "python -m server.wait_dependencies && exec python -m server.worker_main"]
    environment:
      <<: *cloud-task-env
      ARQ_MAX_JOBS: ${CLOUD_ARQ_MAX_JOBS:-16}
      AGENT_WORKER_KIND: ${CLOUD_BACKGROUND_WORKER_KIND:-unified}
      POSTGRES_POOL_SIZE: ${CLOUD_WORKER_POSTGRES_POOL_SIZE:-8}
      POSTGRES_MAX_OVERFLOW: ${CLOUD_WORKER_POSTGRES_MAX_OVERFLOW:-4}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${CLOUD_WORKER_LANGGRAPH_POOL_SIZE:-8}
      REDIS_MAX_CONNECTIONS: ${CLOUD_WORKER_REDIS_MAX_CONNECTIONS:-64}
    ulimits:
      nofile:
        soft: 8192
        hard: 65536
  equipment-worker:
    environment:
      POSTGRES_POOL_SIZE: ${CLOUD_RESEARCH_POSTGRES_POOL_SIZE:-4}
      POSTGRES_MAX_OVERFLOW: ${CLOUD_RESEARCH_POSTGRES_MAX_OVERFLOW:-2}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${CLOUD_RESEARCH_LANGGRAPH_POOL_SIZE:-4}
      REDIS_MAX_CONNECTIONS: ${CLOUD_RESEARCH_REDIS_MAX_CONNECTIONS:-32}
  chat-worker:
    cpu_shares: 1024
    extends:
      file: compose.prod.yaml
      service: worker
    profiles: [agent-pools]
    build: *cloud-api-build
    command: ["sh", "-c", "python -m server.wait_dependencies && exec python -m server.worker_main"]
    environment:
      <<: *cloud-task-env
      AGENT_WORKER_KIND: chat
      ARQ_MAX_JOBS: ${CLOUD_CHAT_MAX_JOBS:-16}
      POSTGRES_POOL_SIZE: ${CLOUD_CHAT_POSTGRES_POOL_SIZE:-8}
      POSTGRES_MAX_OVERFLOW: 4
      LANGGRAPH_POSTGRES_POOL_SIZE: ${CLOUD_CHAT_LANGGRAPH_POOL_SIZE:-4}
      REDIS_MAX_CONNECTIONS: 64
      DEEP_RESEARCH_RUNTIME_DIR: /app/runtime/chat-worker
  deep-worker:
    cpu_shares: 512
    extends:
      file: compose.prod.yaml
      service: worker
    profiles: [agent-pools]
    build: *cloud-api-build
    command: ["sh", "-c", "python -m server.wait_dependencies && exec python -m server.worker_main"]
    environment:
      <<: *cloud-task-env
      AGENT_WORKER_KIND: deep
      ARQ_MAX_JOBS: ${CLOUD_DEEP_AGENT_MAX_JOBS:-2}
      POSTGRES_POOL_SIZE: 4
      POSTGRES_MAX_OVERFLOW: 2
      LANGGRAPH_POSTGRES_POOL_SIZE: 4
      REDIS_MAX_CONNECTIONS: 32
      DEEP_RESEARCH_RUNTIME_DIR: /app/runtime/deep-worker
  subagent-worker:
    cpu_shares: 512
    extends:
      file: compose.prod.yaml
      service: worker
    profiles: [agent-pools]
    build: *cloud-api-build
    command: ["sh", "-c", "python -m server.wait_dependencies && exec python -m server.worker_main"]
    environment:
      <<: *cloud-task-env
      AGENT_WORKER_KIND: subagent
      # auto 只设置随主机扩展的 ARQ 轮询窗口；实时接纳量由共享资源快照决定，
      # PostgreSQL 中的 pending Run 不受窗口大小限制并可在容量恢复后继续执行。
      ARQ_MAX_JOBS: ${CLOUD_SUBAGENT_MAX_JOBS:-auto}
      POSTGRES_POOL_SIZE: 4
      POSTGRES_MAX_OVERFLOW: 2
      LANGGRAPH_POSTGRES_POOL_SIZE: 4
      REDIS_MAX_CONNECTIONS: 32
      DEEP_RESEARCH_RUNTIME_DIR: /app/runtime/subagent-worker
  equipment-query-worker:
    environment:
      POSTGRES_POOL_SIZE: ${CLOUD_QUERY_POSTGRES_POOL_SIZE:-4}
      POSTGRES_MAX_OVERFLOW: ${CLOUD_QUERY_POSTGRES_MAX_OVERFLOW:-2}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${CLOUD_QUERY_LANGGRAPH_POOL_SIZE:-4}
      REDIS_MAX_CONNECTIONS: ${CLOUD_QUERY_REDIS_MAX_CONNECTIONS:-32}
  storage-migrator:
    build: *cloud-api-build
  web:
    ports: !override
      - "127.0.0.1:8088:80"
  minio:
    # 同一官方版本；Quay 在本地域返回 401，Docker Hub 镜像可经腾讯镜像站获取。
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
  graph:
    environment:
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
