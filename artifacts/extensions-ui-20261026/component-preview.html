<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>知识库界面本地预览</title><body><div id="app"></div><script type="module">
import { createApp, h } from 'vue'
import { createPinia } from 'pinia'
import { createRouter, createMemoryHistory } from 'vue-router'
import Antd from 'ant-design-vue'
import 'ant-design-vue/dist/reset.css'
import '/src/assets/css/main.css'
import ExtensionsView from '/src/views/ExtensionsView.vue'
import { useUserStore } from '/src/stores/user.js'
import { databaseApi, typeApi } from '/src/apis/knowledge_api.js'
const mobile = new URLSearchParams(location.search).has('mobile')
const render = new URLSearchParams(location.search).has('render')
if (mobile && !render) {
 document.body.style.margin = '0'
 document.querySelector('#app').innerHTML = '<iframe title="375px 窄屏预览" src="/__extensions-preview.html?render" style="width:375px;height:690px;border:1px solid #ddd;display:block;margin:auto"></iframe>'
} else {
 databaseApi.getDatabases = async () => ({ databases: [{kb_id:'preview',name:'技术',description:'暂无描述',kb_type:'milvus',created_at:'2026-09-26T00:00:00Z',row_count:93,share_config:{permission:'read',scope:'global'},embed_info:{name:'bge-m3'}}] })
 typeApi.getKnowledgeBaseTypes = async () => ({kb_types:{milvus:{}}})
 const app = createApp({render:()=>h(ExtensionsView)})
 const pinia=createPinia()
 const router=createRouter({history:createMemoryHistory(),routes:[{path:'/extensions',component:ExtensionsView}]})
 app.use(pinia);app.use(router);app.use(Antd)
 useUserStore(pinia).userRole='superadmin'
 await router.push('/extensions');await router.isReady()
 app.mount('#app')
 document.body.style.margin='0'
 document.querySelector('#app').style.height='100vh'
}
</script></body></html>
