services:
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-crawling-developer-handoff:v1.0.0
    working_dir: /workspace
    command: ["python", "crawler.py", "--help"]
    volumes:
      - ./data:/workspace/data
      - ./runtime:/workspace/runtime
      - ./.env:/workspace/.env:ro
    environment:
      CRAWLER_DATA_ROOT: /workspace/data
      CRAWLER_RUNTIME_ROOT: /workspace/runtime

  browser:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-crawling-developer-handoff:v1.0.0
    profiles:
      - browser
    working_dir: /workspace
    command: ["/workspace/bin/start-novnc.sh"]
    volumes:
      - ./data:/workspace/data
      - ./runtime:/workspace/runtime
      - ./.env:/workspace/.env:ro
    environment:
      CRAWLER_DATA_ROOT: /workspace/data
      CRAWLER_RUNTIME_ROOT: /workspace/runtime
      DISPLAY: ":99"
    ports:
      - "127.0.0.1:7900:7900"
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:7900/vnc.html"]
      interval: 10s
      timeout: 5s
      retries: 12
