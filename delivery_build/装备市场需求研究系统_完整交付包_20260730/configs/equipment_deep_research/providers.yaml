default_provider: codex
providers:
  codex:
    type: codex_cli
    command: codex
    model: ""
    timeout_seconds: 21600
    sandbox_mode: read-only
    retry_attempts: 2
    extra_args:
      - --ignore-user-config
      - --ignore-rules
      - --disable
      - plugins
      - --disable
      - remote_plugin
      - --disable
      - plugin_sharing
    search_extra_args: []
  responses:
    type: responses_http
    model: gpt-5.5
    base_url_env: EQUIPMENT_DR_BASE_URL
    api_key_env: EQUIPMENT_DR_API_KEY
    timeout_seconds: 120
  fake:
    type: fake
