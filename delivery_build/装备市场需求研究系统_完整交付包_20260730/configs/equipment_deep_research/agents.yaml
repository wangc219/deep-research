default_model: gpt-5.5
agents:
  - agent_id: orchestrator
    harness_profile: orchestration_v1
    skill_ids: [requirement_semantics_analysis, discovery_driver_recognition, discovery_blueprint_generation, dag_loop_orchestration]
    display_name: 主控智能体 Chief Orchestrator
    description: 以资深JS专家人格解析任务语义和边界，识别A-H及OTHER驱动源，生成S1-S6动态蓝图，形成最小充分Agent DAG，并控制内、中、外和元循环的进入、回溯、预算与停止。
    capability_tags: [planning, delegation, loop_control]
    output_contract: baseline_finding_packet
    tools: [analyze_research_request, classify_discovery_drivers, build_discovery_blueprint, plan_execution_waves, evaluate_loop_transition]
    research_policy:
      required_outputs: [任务语义卡, 驱动源评分与OTHER说明, A-H主次路径, S1-S6执行强度, 能力覆盖矩阵, Agent DAG与执行波次, 循环预算与停止条件]
      stopping_conditions: [目标交付物与禁止边界明确, 主次驱动源有任务依据, Agent集合最小且能力覆盖充分, 并发与结构化交接明确, 每级循环有上限回溯点和无增益停止规则]
    handoff_policy: {accept_from: [], wait_for: [], publish_to: [scenario_divergence, case_research, technology_radar, opponent_monitoring, system_confrontation, cross_domain_fusion, nontraditional_security, international_situation, combat_scenario, weapon_equipment, operational_employment, winning_mechanism]}
    model_profile: {provider: codex, model: gpt-5.5, reasoning_effort: high, max_output_tokens: 3600}
    context_policy: {visible_sections: [task, evidence_policy, coverage, checkpoints, trace_summary, agent_harness], token_budget: 7000, hide_other_agent_raw_sessions: true}
    object_read_scopes: [ResearchProblem, EvidenceCard, BaselineFindingPacket, WorkingCheckpoint, TraceEvent]
    object_write_scopes: [WorkingCheckpoint]
    enabled: true
    system_agent: true
  - agent_id: international_situation
    harness_profile: strategic_research_v1
    skill_ids: [strategic_osint, threat_forecasting, force_posture_tracking]
    knowledge_pack_ids: [situation_timeline_library]
    display_name: 国际形势
    description: 面向未来威胁预警，持续研判国际安全态势、潜在威胁力量、联盟与战略格局、对手能力建设和可观测动向。
    capability_tags: [situation, threat, strategy]
    output_contract:
      name: baseline_finding_packet
      properties: [situation_assessment, threat_assessment, strategic_pattern, opponent_moves, warning_indicators, alternative_hypotheses, scenario_drivers]
    tools: [search_sources, fetch_page, create_evidence_card, register_event_timeline, compare_actor_positions, register_warning_indicator, test_competing_hypothesis]
    skills:
      - name: strategic_osint
        objective: 从政府、军方、智库、工业与权威新闻公开材料中建立战略态势证据链。
        method: 事件时间线、行为体-意图-能力三角验证、来源交叉印证。
      - name: threat_forecasting
        objective: 识别未来威胁的先行指标、触发条件、升级路径与替代假设。
        method: 指标与预警、情景区间、竞争假设、反证检验。
      - name: force_posture_tracking
        objective: 跟踪国外力量建设、部署演训、采购投入、联盟协作和作战概念变化。
        method: 趋势基线、异常变化、能力形成节奏和不确定性标注。
    research_policy:
      search_tracks: [战略政策与联盟, 力量建设与部署演训, 装备采购与工业基础, 新兴技术与作战概念, 危机事件与对手表态]
      target_source_count: 8
      min_source_families: 3
      freshness_days: 365
      require_counter_evidence: true
      required_outputs: [态势判断, 威胁评估, 战略格局, 对手动向, 早期预警指标, 替代假设, 对装备需求的牵引]
      stopping_conditions: [主要判断至少双源支撑, 高影响低置信判断进入开放问题, 明确近期中期远期时间尺度]
    handoff_policy:
      accept_from: []
      wait_for: []
      publish_to: [combat_scenario, weapon_equipment, operational_employment, winning_mechanism]
      publish_fields: [findings, analysis_sections, evidence_ids, confidence, open_questions]
    model_profile:
      provider: codex
      model: gpt-5.5
      reasoning_effort: high
      max_output_tokens: 7000
      search_context_size: high
    context_policy:
      visible_sections: [task, evidence_policy, own_checkpoint, recall_request, agent_harness, incremental_knowledge]
      token_budget: 6500
      max_items_per_section: 16
      hide_other_agent_raw_sessions: true
    object_read_scopes: [ResearchProblem, EvidenceCard, WorkingCheckpoint]
    object_write_scopes: [EvidenceCard, StrategicAssessment, BaselineFindingPacket, WorkingCheckpoint]
    enabled: true
  - agent_id: combat_scenario
    harness_profile: scenario_research_v1
    skill_ids: [scenario_engineering, modern_battlespace_analysis, adversary_coa_analysis]
    knowledge_pack_ids: [scenario_pattern_library]
    display_name: 作战场景
    description: 将威胁研判转化为现代化、多域、动态对抗场景，分析阶段演化、敌方行动方案、关键时间窗口和环境约束。
    capability_tags: [scenario, coa, environment]
    output_contract:
      name: baseline_finding_packet
      properties: [scenario_framework, enemy_coa, critical_timeline, environment_constraints, scenario_branches, capability_pressure_points, assumptions]
    tools: [search_sources, fetch_page, create_evidence_card, build_scenario_graph, branch_scenario, map_critical_window, map_environment_constraint, stress_test_scenario]
    skills:
      - name: scenario_engineering
        objective: 构建背景、参与力量、任务目标、阶段、触发器、终止条件和胜负判据完整的场景框架。
        method: 场景树、关键事件链、分支与边界条件。
      - name: modern_battlespace_analysis
        objective: 纳入无人化、智能化、跨域协同、强电磁对抗、网络受限、城市与复杂地形等战场变化。
        method: 多域约束矩阵、环境压力测试、体系依赖识别。
      - name: adversary_coa_analysis
        objective: 形成多个敌方可能行动方案及其可观测指标、关键节点和风险。
        method: 最可能/最危险/替代方案比较，不输出可直接执行的攻击指令。
    research_policy:
      search_tracks: [近年公开战例, 现代演训与作战概念, 无人和智能系统运用, 电磁网络与太空约束, 城市海岸高原等环境变化]
      target_source_count: 7
      min_source_families: 3
      require_counter_evidence: true
      required_outputs: [场景框架, 敌方方案, 关键时间节点, 地形环境约束, 场景分支, 可观测指标, 能力压力点]
      scenario_horizons: [危机前预警, 初始接触, 体系对抗, 持续作战, 战损重构]
      stopping_conditions: [至少形成两个场景分支, 每个关键节点关联证据或假设, 环境约束能够映射到装备功能]
    handoff_policy:
      accept_from: [scenario_divergence, case_research, technology_radar, opponent_monitoring, system_confrontation, cross_domain_fusion, nontraditional_security, international_situation]
      wait_for: []
      publish_to: [weapon_equipment, operational_employment, winning_mechanism]
      publish_fields: [findings, analysis_sections, evidence_ids, confidence, open_questions]
    model_profile:
      provider: codex
      model: gpt-5.5
      reasoning_effort: high
      max_output_tokens: 6500
      search_context_size: high
    context_policy:
      visible_sections: [task, evidence_policy, own_checkpoint, recall_request, agent_harness, upstream_handoffs, incremental_knowledge]
      token_budget: 7500
      max_items_per_section: 18
      hide_other_agent_raw_sessions: true
    object_read_scopes: [ResearchProblem, EvidenceCard, WorkingCheckpoint]
    object_write_scopes: [EvidenceCard, ScenarioModel, BaselineFindingPacket, WorkingCheckpoint]
    enabled: true
  - agent_id: weapon_equipment
    harness_profile: equipment_research_v1
    skill_ids: [equipment_osint, capability_comparison, technology_readiness_analysis, defensive_countermeasure_analysis]
    knowledge_pack_ids: [equipment_program_library]
    display_name: 武器装备
    description: 深度检索国外现役、在研与替代装备，建立型号谱系、参数证据、体系依赖和能力边界；按需调用成本、平台、时间、效应、体系和可控性颠覆种子，形成现役做优与新研拓新的具体装备族需求。
    capability_tags: [equipment, capability_gap, technology_readiness]
    output_contract:
      name: baseline_finding_packet
      properties: [foreign_equipment_landscape, equipment_profiles, current_parameters, parameter_observations, parameter_conflicts, development_models, technology_readiness, system_dependencies, capability_constraints, scenario_fit, capability_gaps, long_range_precision_missile_evidence, long_range_unmanned_strike_evidence, standoff_suppression_evidence, defensive_countermeasure_options, upgrade_requirements, new_equipment_requirements, verification_plan]
    tools: [search_sources, fetch_page, create_evidence_card, extract_parameter_observation, normalize_equipment_variant, reconcile_parameter_conflict, assess_technology_readiness, compare_equipment_capability, map_defensive_countermeasure, formulate_equipment_requirement]
    skills:
      - name: equipment_osint
        objective: 从制造商、政府预算、军方资料、展会与权威研究中建立国外装备能力档案。
        method: 型号归一、参数区间、批次差异、来源可信度和日期标注。
      - name: capability_comparison
        objective: 将目标场景所需功能与国内外公开装备能力进行可比维度映射。
        method: 功能-性能-体系接口-保障-成本五维对比，避免只比较单一参数。
      - name: defensive_countermeasure_analysis
        objective: 识别国外装备的任务优势、体系依赖、适用边界与可观测约束，将其映射为探测、防护、抗干扰、韧性、保障和体系协同等防御性反制能力，并区分现役升级与新装备立项需求。
        method: 按“国外装备能力—依赖/约束—主题场景压力—防御功能—升级或新研需求—成熟度—验证方法—证据”链条逐项输出，不给出具体攻击步骤或制造参数。
    research_policy:
      search_tracks: [远打精打导弹与战役纵深精确火力, 远程无人打击平台与侦打毁伤载荷, 远域压制与防空电子战火力压制效应器, 国外现役型号谱系与部署规模, 在研预研项目与预算采购, 关键参数任务载荷与批次差异, 指挥控制数据链与体系接口, 试验演训和公开运用表现, 保障成本产能出口与供应链, 环境限制失效边界与体系依赖, 同类替代型号与竞争技术路线]
      target_source_count: 16
      min_source_families: 4
      freshness_days: 1095
      require_counter_evidence: true
      required_outputs: [国外装备全景, 重点型号档案, 现有装备参数, 在研型号, 技术成熟度, 体系依赖, 能力约束, 场景适配度, 能力差距, 远打精打导弹专项证据, 远程无人打击专项证据, 远域压制专项证据, 颠覆逻辑候选, 防御性反制选项, 现役升级需求, 新装备研发需求, 验证计划]
      parameter_rule: 参数必须记录单位、区间、型号批次、来源日期和置信度；冲突数据并列保留。
      stopping_conditions: [重点型号至少双源核验且覆盖现役在研替代路线, 参数无法核实时使用区间或未知, 差距能够回溯到场景和威胁, 每项反制或研发需求均回溯到国外装备能力及公开证据, 明确升级与新研的选择理由和验证方法]
    handoff_policy:
      accept_from: [scenario_divergence, case_research, technology_radar, opponent_monitoring, system_confrontation, cross_domain_fusion, nontraditional_security, international_situation, combat_scenario]
      wait_for: []
      publish_to: [operational_employment, winning_mechanism]
      publish_fields: [findings, analysis_sections, evidence_ids, confidence, open_questions]
    model_profile:
      provider: codex
      model: gpt-5.5
      reasoning_effort: high
      max_output_tokens: 7000
      search_context_size: high
    context_policy:
      visible_sections: [task, evidence_policy, own_checkpoint, recall_request, agent_harness, upstream_handoffs, incremental_knowledge]
      token_budget: 8500
      max_items_per_section: 20
      hide_other_agent_raw_sessions: true
    object_read_scopes: [ResearchProblem, EvidenceCard, WorkingCheckpoint]
    object_write_scopes: [EvidenceCard, EquipmentObservation, BaselineFindingPacket, WorkingCheckpoint]
    enabled: true
