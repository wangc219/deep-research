      require_counter_evidence: true
      required_outputs: [作战约束, 兵力协同, COA, 经验教训, 部署原则, 失败模式, 对装备功能的要求]
      coa_rule: 至少比较基线、弹性分布和资源受限三类方案，明确适用条件与不可行边界。
      stopping_conditions: [每个方案关联上游证据和装备约束, 明确协同接口与保障条件, 结论能够转化为装备功能而非具体攻击指令]
    handoff_policy:
