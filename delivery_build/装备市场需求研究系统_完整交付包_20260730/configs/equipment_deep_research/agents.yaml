      - name: operational_synthesis
        objective: 将威胁、场景和装备能力整合为任务链、力量关系、保障条件与能力需求。
        method: 任务-能力-力量映射、体系依赖和约束传播。
      - name: coa_comparison
        objective: 比较多个防御性或任务级行动方案的适用条件、风险、韧性、资源和可持续性。
        method: COA矩阵、敏感性分析、失败模式与替代方案。
      - name: joint_force_coordination
        objective: 分析跨域、跨平台、有人无人、传感器-指挥-效应器-保障协同。
        method: 信息流、指挥关系、接口与节奏匹配。
      - name: lessons_transfer
        objective: 从公开战例中提取可迁移经验、失败模式和适用边界。
        method: 背景差异校正、因果链和反事实检验。
    research_policy:
      search_tracks: [公开战例与复盘, 联合和多域作战概念, 有人无人协同, 指挥控制与保障韧性, 持续作战和战损恢复]
      target_source_count: 8
