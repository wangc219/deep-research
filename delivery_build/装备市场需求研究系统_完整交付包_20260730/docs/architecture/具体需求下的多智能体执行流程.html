}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;agent-flow-visual&quot;&gt;
  &lt;style&gt;
    #agent-flow-visual { color: var(--foreground); display: grid; gap: 18px; }
    #agent-flow-visual .section-label { font-weight: 500; margin-bottom: 8px; }
    #agent-flow-visual .route-note { color: var(--muted-foreground); }
    #agent-flow-visual .agent-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    #agent-flow-visual .agent-node { padding: 12px; background: color-mix(in srgb, var(--viz-series-1) 10%, transparent); min-height: 92px; }
    #agent-flow-visual .agent-node.off { opacity: .38; background: var(--muted); }
    #agent-flow-visual .agent-name { font-weight: 500; margin-bottom: 5px; }
    #agent-flow-visual .agent-tags, #agent-flow-visual .muted { color: var(--muted-foreground); }
    #agent-flow-visual .wave-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
    #agent-flow-visual .wave { padding: 12px 0; border-top: 2px solid var(--border); }
    #agent-flow-visual .wave.active { border-color: var(--viz-series-1); }
    #agent-flow-visual .wave-title { font-weight: 500; margin-bottom: 8px; }
    #agent-flow-visual .wave-items { display: grid; gap: 7px; }
    #agent-flow-visual .wave-item { padding: 9px; background: color-mix(in srgb, var(--viz-series-2) 10%, transparent); }
    #agent-flow-visual .pipeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
    #agent-flow-visual .stage { position: relative; padding: 11px 8px; min-height: 74px; background: var(--muted); color: var(--foreground); border: 0; text-align: left; }
    #agent-flow-visual .stage[aria-pressed=&quot;true&quot;] { background: var(--primary); color: var(--primary-foreground); }
    #agent-flow-visual .stage:not(:last-child)::after { content: &quot;→&quot;; position: absolute; right: -8px; top: 28px; color: var(--muted-foreground); z-index: 2; }
    #agent-flow-visual .stage-no { display: block; opacity: .72; margin-bottom: 4px; }
    #agent-flow-visual .detail { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
    #agent-flow-visual .detail-list { margin: 0; padding-left: 18px; }
    #agent-flow-visual .detail-list li + li { margin-top: 6px; }
    #agent-flow-visual .gate-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #agent-flow-visual .gate-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--viz-series-1); }
    #agent-flow-visual .cap-table { width: 100%; border-collapse: collapse; }
    #agent-flow-visual .cap-table th, #agent-flow-visual .cap-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    #agent-flow-visual .cap-table th { color: var(--muted-foreground); font-weight: 500; }
    #agent-flow-visual .flow-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    #agent-flow-visual .flow-chip { padding: 7px 9px; background: color-mix(in srgb, var(--viz-series-3) 12%, transparent); }
    #agent-flow-visual .arrow { color: var(--muted-foreground); }
    @media (max-width: 700px) {
      #agent-flow-visual .agent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #agent-flow-visual .wave-grid, #agent-flow-visual .detail { grid-template-columns: 1fr; }
      #agent-flow-visual .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #agent-flow-visual .stage::after { display: none; }
    }
    @media (max-width: 420px) {
      #agent-flow-visual .agent-grid, #agent-flow-visual .pipeline { grid-template-columns: 1fr; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;案例与研究路线&quot;&gt;

      &lt;select id=&quot;case-select&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;drone&quot;&gt;低空无人机防护&lt;/option&gt;
        &lt;option value=&quot;gap&quot;&gt;现役装备能力缺口&lt;/option&gt;
        &lt;option value=&quot;war&quot;&gt;局部战争案例复盘&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;研究路线
      &lt;select id=&quot;route-select&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;new&quot;&gt;新制胜机理&lt;/option&gt;
        &lt;option value=&quot;traditional&quot;&gt;传统能力缺口&lt;/option&gt;
        &lt;option value=&quot;war&quot;&gt;局部战争案例&lt;/option&gt;
      &lt;/select&gt;

  &lt;/div&gt;

  &lt;div class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;

  &lt;/div&gt;

  &lt;section aria-labelledby=&quot;selection-label&quot;&gt;
    &lt;div class=&quot;section-label&quot; id=&quot;selection-label&quot;&gt;任务驱动的 Agent 自主选择&lt;/div&gt;
    &lt;div class=&quot;agent-grid&quot; id=&quot;agent-grid&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;waves-label&quot;&gt;
    &lt;div class=&quot;section-label&quot; id=&quot;waves-label&quot;&gt;依赖安全的执行波次&lt;/div&gt;
    &lt;div class=&quot;wave-grid&quot; id=&quot;wave-grid&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;handoff-label&quot;&gt;
    &lt;div class=&quot;section-label&quot; id=&quot;handoff-label&quot;&gt;结构化交接链&lt;/div&gt;
    &lt;div class=&quot;flow-strip&quot; id=&quot;handoff-strip&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;reason-label&quot;&gt;
    &lt;div class=&quot;section-label&quot; id=&quot;reason-label&quot;&gt;制胜机理六步推理&lt;/div&gt;
    &lt;div class=&quot;pipeline&quot; id=&quot;pipeline&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;detail&quot;&gt;
    &lt;div class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;section-label&quot; id=&quot;step-title&quot;&gt;&lt;/div&gt;
      &lt;ul class=&quot;detail-list&quot; id=&quot;step-details&quot;&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;section-label&quot;&gt;门控与定向再调&lt;/div&gt;
      &lt;div class=&quot;gate-line&quot;&gt;&lt;span class=&quot;gate-dot&quot;&gt;&lt;/span&gt;&lt;span id=&quot;gate-name&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;p id=&quot;gate-rule&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;muted&quot; id=&quot;recall-example&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;section aria-labelledby=&quot;effect-label&quot;&gt;
    &lt;div class=&quot;section-label&quot; id=&quot;effect-label&quot;&gt;案例效果链&lt;/div&gt;
    &lt;div class=&quot;flow-strip&quot; id=&quot;effect-chain&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;cap-label&quot;&gt;
    &lt;div class=&quot;section-label&quot; id=&quot;cap-label&quot;&gt;九字段能力画像示例&lt;/div&gt;
    &lt;table class=&quot;cap-table&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;字段&lt;/th&gt;&lt;th&gt;新能力方向&lt;/th&gt;&lt;th&gt;现有装备升级&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody id=&quot;cap-body&quot;&gt;&lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;agent-flow-visual&#x27;);
      const cases = {
        drone: {
          route: &#x27;new&#x27;,
          title: &#x27;低空小型无人机与蜂群威胁下的重要固定目标防护&#x27;,
          objective: &#x27;回答需要发展什么产品功能，并建立场景—威胁—制胜逻辑—效果链—能力—差距—证据闭环。&#x27;,
          agents: [&#x27;situation&#x27;,&#x27;scenario&#x27;,&#x27;equipment&#x27;,&#x27;operation&#x27;],
          waves: [[&#x27;国际形势 Agent&#x27;],[&#x27;作战场景 Agent&#x27;,&#x27;武器装备 Agent&#x27;],[&#x27;作战运用 Agent&#x27;]],
          handoff: [&#x27;ResearchProblem&#x27;,&#x27;动态 Agent 选择&#x27;,&#x27;BaselineFindingPacket[]&#x27;,&#x27;WinningMechanismInput&#x27;,&#x27;L1/L2/L3&#x27;,&#x27;AuditResult&#x27;,&#x27;能力画像&#x27;],
          effect: [&#x27;多源持续发现&#x27;,&#x27;可信识别与航迹融合&#x27;,&#x27;威胁排序&#x27;,&#x27;软硬手段编排&#x27;,&#x27;断链降级运行&#x27;,&#x27;维持任务连续性&#x27;],
          capability: {
            id: [&#x27;CAP-NEW-001&#x27;,&#x27;CAP-UPGRADE-001&#x27;],
            name: [&#x27;分布式智能低空防护闭环能力&#x27;,&#x27;现有低空探测与处置装备协同升级能力&#x27;],
            category: [&#x27;低空防护体系/任务系统&#x27;,&#x27;现役雷达、光电、处置与指挥节点&#x27;],
            type: [&#x27;新作战能力方向&#x27;,&#x27;现有装备升级需求&#x27;],
            logic: [&#x27;多源感知、快速可信判别、资源优化分配、分层处置和韧性重构&#x27;,&#x27;以标准接口和软件定义协同把分散单机接入统一闭环&#x27;],
            scenario: [&#x27;复杂背景、强电磁约束、多批次目标压力&#x27;,&#x27;多型号异构设备持续值班与节点受损场景&#x27;],
            priority: [&#x27;高&#x27;,&#x27;中高&#x27;],
            gap: [&#x27;跨系统融合、高并发排序、断链自治存在关键差距&#x27;,&#x27;数据接口、统一航迹、状态回传与降级运行不一致&#x27;],
            image: [&#x27;异构传感器接入、统一航迹、多模态识别、人机协同决策、效应器编排、边缘自治&#x27;,&#x27;数据适配、边缘融合、可信同步、统一任务接口、故障隔离与远程升级&#x27;]
          }
        },
        gap: {
          route: &#x27;traditional&#x27;,
          title: &#x27;现役装备在复杂电磁环境下的探测与协同能力缺口&#x27;,
          objective: &#x27;以传统任务和现有装备为基线，比较场景要求，区分能力空白与可工程化升级项。&#x27;,
          agents: [&#x27;scenario&#x27;,&#x27;equipment&#x27;,&#x27;operation&#x27;],
          waves: [[&#x27;作战场景 Agent&#x27;,&#x27;武器装备 Agent&#x27;],[&#x27;作战运用 Agent&#x27;],[&#x27;制胜机理 Agent&#x27;]],
          handoff: [&#x27;ResearchProblem&#x27;,&#x27;场景/装备并行研究&#x27;,&#x27;差距矩阵&#x27;,&#x27;能力映射&#x27;,&#x27;L2可行性&#x27;,&#x27;审计&#x27;,&#x27;升级需求&#x27;],
          effect: [&#x27;建立任务基线&#x27;,&#x27;装备参数归一&#x27;,&#x27;场景压力对比&#x27;,&#x27;差距五档评价&#x27;,&#x27;升级功能筛选&#x27;],
          capability: {
            id: [&#x27;CAP-NEW-101&#x27;,&#x27;CAP-UPGRADE-101&#x27;], name: [&#x27;能力空白补位组件&#x27;,&#x27;现役系统协同升级包&#x27;], category: [&#x27;任务载荷/边缘节点&#x27;,&#x27;现役探测与指挥系统&#x27;], type: [&#x27;新能力补位&#x27;,&#x27;现有装备升级&#x27;], logic: [&#x27;补齐传统体系无法覆盖的残余任务链&#x27;,&#x27;复用现役硬件并提升体系接口与抗扰能力&#x27;], scenario: [&#x27;复杂电磁与网络受限场景&#x27;,&#x27;现役设备混合部署场景&#x27;], priority: [&#x27;中高&#x27;,&#x27;高&#x27;], gap: [&#x27;关键任务节点存在能力空白&#x27;,&#x27;接口与协同存在关键差距&#x27;], image: [&#x27;模块化任务载荷、边缘自治、快速部署&#x27;,&#x27;标准接口、融合处理、抗干扰、降级运行&#x27;]
          }
        },
        war: {
          route: &#x27;war&#x27;,
          title: &#x27;局部战争案例中的无人系统运用与战损重构经验复盘&#x27;,
          objective: &#x27;从时间线、装备、打法、效果和不足中提取可迁移能力，不默认调用国际形势 Agent。&#x27;,
          agents: [&#x27;scenario&#x27;,&#x27;equipment&#x27;,&#x27;operation&#x27;],
          waves: [[&#x27;作战场景 Agent&#x27;,&#x27;武器装备 Agent&#x27;],[&#x27;作战运用 Agent&#x27;],[&#x27;制胜机理 Agent&#x27;]],
          handoff: [&#x27;案例边界&#x27;,&#x27;场景/装备证据&#x27;,&#x27;经验与反证&#x27;,&#x27;迁移条件&#x27;,&#x27;L1/L2/L3&#x27;,&#x27;审计&#x27;,&#x27;未来布局&#x27;],
          effect: [&#x27;还原案例时间线&#x27;,&#x27;识别新打法&#x27;,&#x27;验证作战效果&#x27;,&#x27;提取失败模式&#x27;,&#x27;校正迁移边界&#x27;,&#x27;形成未来布局&#x27;],
          capability: {
            id: [&#x27;CAP-NEW-201&#x27;,&#x27;CAP-UPGRADE-201&#x27;], name: [&#x27;战损后分布式重构能力&#x27;,&#x27;现役节点快速恢复升级能力&#x27;], category: [&#x27;分布式任务体系&#x27;,&#x27;现役指挥与保障节点&#x27;], type: [&#x27;新作战能力方向&#x27;,&#x27;现有装备升级&#x27;], logic: [&#x27;通过节点自治和任务重分配保持体系连续性&#x27;,&#x27;缩短故障隔离、替换和重新接入时间&#x27;], scenario: [&#x27;局部战争持续消耗与链路受损场景&#x27;,&#x27;现役节点战损恢复场景&#x27;], priority: [&#x27;高&#x27;,&#x27;中高&#x27;], gap: [&#x27;自治重构与跨节点任务迁移不足&#x27;,&#x27;恢复流程与接口自动化不足&#x27;], image: [&#x27;战损感知、自治组网、任务迁移、资源重分配&#x27;,&#x27;故障隔离、热替换、状态同步、快速回网&#x27;]
          }
        }
      };
      const agentDefs = [
        [&#x27;situation&#x27;,&#x27;国际形势 Agent&#x27;,&#x27;situation · threat · strategy&#x27;,&#x27;态势、威胁、战略格局与预警指标&#x27;],
        [&#x27;scenario&#x27;,&#x27;作战场景 Agent&#x27;,&#x27;scenario · COA · environment&#x27;,&#x27;阶段、分支、关键窗口与环境约束&#x27;],
        [&#x27;equipment&#x27;,&#x27;武器装备 Agent&#x27;,&#x27;equipment · gap · readiness&#x27;,&#x27;参数、成熟度、体系接口与能力边界&#x27;],
        [&#x27;operation&#x27;,&#x27;作战运用 Agent&#x27;,&#x27;operation · coordination · lessons&#x27;,&#x27;协同、方案、保障约束与经验迁移&#x27;]
      ];
      const steps = [
        [&#x27;防御解构&#x27;,[&#x27;按感知、决策、处置、冗余/恢复分层&#x27;,&#x27;从 Packet 和证据提取重心、依赖、薄弱点与时间窗口&#x27;],&#x27;L1 门控&#x27;,&#x27;证据完整、平均置信度≥70%、路线必需 capability 已覆盖&#x27;,&#x27;不足时定向召回威胁、场景或装备能力 Agent&#x27;],
        [&#x27;制胜路径&#x27;,[&#x27;生成多个候选路径&#x27;,&#x27;比较风险、效果、适用边界和公开战例支撑&#x27;],&#x27;L1 门控&#x27;,&#x27;候选路径必须能回溯到场景与证据&#x27;,&#x27;路径缺少反证时召回对应领域 Agent&#x27;],
        [&#x27;效果链&#x27;,[&#x27;形成行动→直接效果→间接效果→最终收益&#x27;,&#x27;每个节点登记证据、假设与风险&#x27;],&#x27;L1 门控&#x27;,&#x27;关键链路不能存在无证据跳跃&#x27;,&#x27;链路缺口回到 L1 指定节点补证&#x27;],
        [&#x27;能力映射&#x27;,[&#x27;把效果转换为功能，再转换为性能和约束&#x27;,&#x27;输出感知、判别、决策、协同、处置和保障能力&#x27;],&#x27;L2 门控&#x27;,&#x27;创新方向可行性≥3/5，且技术成熟度有依据&#x27;,&#x27;技术成熟度不足时精确召回武器装备 Agent，return_node=L2&#x27;],
        [&#x27;差距量化&#x27;,[&#x27;与现有/在研能力进行可比维度映射&#x27;,&#x27;按空白、关键差距、部分差距、满足、超出五档评价&#x27;],&#x27;L3 门控&#x27;,&#x27;差距必须有参数、场景或明确未知项支撑&#x27;,&#x27;参数或比较基线不足时召回 equipment/capability_gap，return_node=L3&#x27;],
        [&#x27;能力画像生成&#x27;,[&#x27;去重归并并区分新能力与现有装备升级&#x27;,&#x27;形成九字段画像和双向追溯关系&#x27;],&#x27;最终审计&#x27;,&#x27;一致性、置信度、覆盖度、分析师确认和实际轮次全部通过&#x27;,&#x27;未确认只生成待审稿；超过轮次则输出受限结论&#x27;]
      ];

      const caseSelect = root.querySelector(&#x27;#case-select&#x27;);
      const routeSelect = root.querySelector(&#x27;#route-select&#x27;);
      let selectedStep = 0;

      function chip(text) { return `&lt;span class=&quot;flow-chip&quot;&gt;${text}&lt;/span&gt;`; }
      function arrows(items) { return items.map((item, i) =&gt; `${chip(item)}${i &lt; items.length - 1 ? &#x27;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;&#x27; : &#x27;&#x27;}`).join(&#x27;&#x27;); }
      function render() {
        const data = cases[caseSelect.value];
        routeSelect.value = data.route;
        root.querySelector(&#x27;#case-title&#x27;).textContent = data.title;
        root.querySelector(&#x27;#case-objective&#x27;).textContent = data.objective;
        root.querySelector(&#x27;#agent-grid&#x27;).innerHTML = agentDefs.map(([id,name,tags,desc]) =&gt; `&lt;div class=&quot;agent-node ${data.agents.includes(id) ? &#x27;&#x27; : &#x27;off&#x27;}&quot;&gt;&lt;div class=&quot;agent-name&quot;&gt;${name}&lt;/div&gt;&lt;div&gt;${desc}&lt;/div&gt;&lt;div class=&quot;agent-tags&quot;&gt;${tags}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#wave-grid&#x27;).innerHTML = data.waves.map((wave, i) =&gt; `&lt;div class=&quot;wave ${i === 0 ? &#x27;active&#x27; : &#x27;&#x27;}&quot;&gt;&lt;div class=&quot;wave-title&quot;&gt;波次 ${i + 1}${wave.length &gt; 1 ? &#x27; · 并发&#x27; : &#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;wave-items&quot;&gt;${wave.map(item =&gt; `&lt;div class=&quot;wave-item&quot;&gt;${item}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#handoff-strip&#x27;).innerHTML = arrows(data.handoff);
        root.querySelector(&#x27;#effect-chain&#x27;).innerHTML = arrows(data.effect);
        const fields = [[&#x27;能力编号&#x27;,&#x27;id&#x27;],[&#x27;名称&#x27;,&#x27;name&#x27;],[&#x27;装备类别&#x27;,&#x27;category&#x27;],[&#x27;类型&#x27;,&#x27;type&#x27;],[&#x27;来源制胜逻辑&#x27;,&#x27;logic&#x27;],[&#x27;关联场景&#x27;,&#x27;scenario&#x27;],[&#x27;优先级&#x27;,&#x27;priority&#x27;],[&#x27;能力差距&#x27;,&#x27;gap&#x27;],[&#x27;能力画像&#x27;,&#x27;image&#x27;]];
        root.querySelector(&#x27;#cap-body&#x27;).innerHTML = fields.map(([label,key]) =&gt; `&lt;tr&gt;&lt;th&gt;${label}&lt;/th&gt;&lt;td&gt;${data.capability[key][0]}&lt;/td&gt;&lt;td&gt;${data.capability[key][1]}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
        renderStep();
      }
      function renderStep() {
        const [title, details, gate, rule, recall] = steps[selectedStep];
        root.querySelectorAll(&#x27;.stage&#x27;).forEach((button, index) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(index === selectedStep)));
        root.querySelector(&#x27;#step-title&#x27;).textContent = `${selectedStep + 1}. ${title}`;
        root.querySelector(&#x27;#step-details&#x27;).innerHTML = details.map(item =&gt; `&lt;li&gt;${item}&lt;/li&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#gate-name&#x27;).textContent = gate;
        root.querySelector(&#x27;#gate-rule&#x27;).textContent = rule;
        root.querySelector(&#x27;#recall-example&#x27;).textContent = `再调：${recall}`;
      }
      root.querySelector(&#x27;#pipeline&#x27;).innerHTML = steps.map((step, i) =&gt; `&lt;button type=&quot;button&quot; class=&quot;stage&quot; aria-pressed=&quot;${i === 0}&quot; data-step=&quot;${i}&quot;&gt;&lt;span class=&quot;stage-no&quot;&gt;步骤 ${i + 1}&lt;/span&gt;${step[0]}&lt;/button&gt;`).join(&#x27;&#x27;);
      root.querySelector(&#x27;#pipeline&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const button = event.target.closest(&#x27;[data-step]&#x27;);
        if (!button) return;
        selectedStep = Number(button.dataset.step);
        renderStep();
      });
      caseSelect.addEventListener(&#x27;change&#x27;, render);
      routeSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
        const matching = Object.entries(cases).find(([,data]) =&gt; data.route === routeSelect.value);
        if (matching) caseSelect.value = matching[0];
        render();
      });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
