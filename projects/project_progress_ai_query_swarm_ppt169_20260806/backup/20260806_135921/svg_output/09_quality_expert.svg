<g id="header" data-pptx-bounds="56 42 1168 104"><text x="56" y="74" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">08 / 质量提升</text><text x="56" y="128" font-family="Microsoft YaHei, Arial" font-size="42" font-weight="700" fill="#0D2B55">不让“看起来像答案”的方案，直接变成正式结论</text></g>
<g id="three-questions" data-pptx-bounds="56 210 1168 232"><rect x="56" y="210" width="352" height="232" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="84" y="258" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0D2B55">先问：说得通吗？</text><text x="84" y="306" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">是否符合任务和场景</text><text x="84" y="342" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">因果链和军事价值是否成立</text><rect x="464" y="210" width="352" height="232" fill="#0D2B55"/><text x="492" y="258" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#E89A22">再问：落得下吗？</text><text x="492" y="306" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">装备是不是具体</text><text x="492" y="342" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">工程上是否可行、可验证</text><rect x="872" y="210" width="352" height="232" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="900" y="258" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0D2B55">最后问：站得住吗？</text><text x="900" y="306" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">证据是否可信、方案是否重复</text><text x="900" y="342" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">能否面对反例和后续复核</text></g>
<g id="outcomes" data-pptx-bounds="56 510 1168 98"><rect x="56" y="510" width="1168" height="98" fill="#0D2B55"/><text x="84" y="550" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#E89A22">独立专家评审的三种结果</text><text x="84" y="588" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">通过 → 进入正式收敛　　缺关键一块 → 定向补齐　　经不起复核 → 阻断发布并留下原因</text></g>
