<g id="header" data-pptx-bounds="56 42 1168 104"><text x="56" y="74" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">03 / 两种带队方式</text><text x="56" y="128" font-family="Microsoft YaHei, Arial" font-size="42" font-weight="700" fill="#0D2B55">面对同一个难题，我们准备了两种“带队做研究”的办法</text></g>
<g id="journey" data-pptx-bounds="56 210 1168 210"><line x1="150" y1="322" x2="1118" y2="322" stroke="#2B78B8" stroke-width="5"/><circle cx="150" cy="322" r="44" fill="#0D2B55"/><circle cx="470" cy="322" r="44" fill="#0D2B55"/><circle cx="790" cy="322" r="44" fill="#0D2B55"/><circle cx="1118" cy="322" r="44" fill="#E89A22"/><text x="150" y="330" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text><text x="470" y="330" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text><text x="790" y="330" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text><text x="1118" y="330" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text><text x="150" y="398" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">先看清问题</text><text x="470" y="398" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">再想出方向</text><text x="790" y="398" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">拿证据核验</text><text x="1118" y="398" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">形成可交付结论</text></g>
<g id="two-teams" data-pptx-bounds="56 470 1168 128"><rect x="56" y="470" width="548" height="128" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="84" y="516" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#0D2B55">质量集群</text><text x="84" y="554" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">像固定、成熟的专家小组：按既定节奏快速会诊</text><text x="84" y="582" font-family="Microsoft YaHei, Arial" font-size="18" fill="#2B78B8">特点：稳住节奏，把方向先摸清</text><rect x="676" y="470" width="548" height="128" fill="#0D2B55"/><text x="704" y="516" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#E89A22">动态蜂群</text><text x="704" y="554" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">像按问题临时增援的专项顾问：缺哪块就补哪块</text><text x="704" y="582" font-family="Microsoft YaHei, Arial" font-size="18" fill="#EAF0F7">特点：补齐短板，把正式结论守住</text></g>
<g id="footer" data-pptx-bounds="56 662 1160 34"><text x="56" y="686" font-family="Microsoft YaHei, Arial" font-size="16" fill="#52606D">两条路共享 S1–S6 主链：对手与场景 → 方案与装备 → 证据与验证 → 能力画像；差别只在团队怎么组织</text><text x="1194" y="686" font-family="Arial" font-size="16" font-weight="700" fill="#0D2B55">04</text></g>
</svg>
