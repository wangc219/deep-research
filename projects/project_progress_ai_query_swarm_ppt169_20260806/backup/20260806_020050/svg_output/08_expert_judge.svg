<g id="header" data-pptx-bounds="56 36 1168 154"><text x="56" y="68" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">07 / 独立专家评审</text><text x="56" y="106" font-family="Microsoft YaHei, Arial" font-size="40" font-weight="700" fill="#0D2B55">评审专家智能体不是再写一份报告，<tspan x="56" dy="48">而是独立决定候选能否进入交付收敛</tspan></text></g>
<g id="input-path" data-pptx-bounds="56 190 320 330"><rect x="56" y="190" width="320" height="330" fill="#0D2B55"/><text x="84" y="236" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#E89A22">只读盲评输入</text><text x="84" y="292" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#FFFFFF">版本化候选账本</text><text x="84" y="336" font-family="Microsoft YaHei, Arial" font-size="24" fill="#EAF0F7">+ 有效证据 ID</text><line x1="84" y1="370" x2="340" y2="370" stroke="#E89A22" stroke-width="4"/><text x="84" y="420" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">不读取其他 Agent 原始会话</text><text x="84" y="456" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">只输出结论与淘汰理由</text></g>
<g id="judge-core" data-pptx-bounds="432 170 336 380"><circle cx="600" cy="360" r="156" fill="#EAF0F7" stroke="#0D2B55" stroke-width="4"/><text x="600" y="318" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#0D2B55">quality_expert_judge</text><text x="600" y="358" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">领域契合 · 能力落点 · 创新性</text><text x="600" y="390" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">军事价值 · 因果 · 证据质量</text><text x="600" y="422" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">工程可行性 · 稳健性</text><text x="600" y="468" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" fill="#52606D">八维独立评审</text></g>
<g id="outcomes" data-pptx-bounds="840 190 384 330"><rect x="840" y="190" width="384" height="96" fill="#EAF0F7" stroke="#2B78B8" stroke-width="2"/><text x="866" y="230" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">通过 → 进入发布收敛</text><text x="866" y="262" font-family="Microsoft YaHei, Arial" font-size="18" fill="#18212F">综合分 ≥ 0.72</text><rect x="840" y="308" width="384" height="96" fill="#FFF3E1" stroke="#E89A22" stroke-width="2"/><text x="866" y="348" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#B45F06">修复 → 返回候选账本</text><text x="866" y="380" font-family="Microsoft YaHei, Arial" font-size="18" fill="#18212F">关键维度不足时定向修复</text><rect x="840" y="426" width="384" height="96" fill="#0D2B55"/><text x="866" y="466" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#FFFFFF">阻断 → 审计留痕</text><text x="866" y="498" font-family="Arial" font-size="18" fill="#EAF0F7">quality_expert_judge_blocked_release</text></g>
<g id="threshold-note" data-pptx-bounds="56 560 1168 88"><text x="56" y="590" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#0D2B55">关键维度门槛：领域契合、装备能力落点、军事价值、可信度均不低于 0.60；<tspan x="56" dy="26">专家评审是动态模式的强制发布条件。</tspan></text></g>
