<g id="header" data-pptx-bounds="56 42 1168 104"><text x="56" y="74" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">06 / 动态孵化的思想来源</text><text x="56" y="128" font-family="Microsoft YaHei, Arial" font-size="42" font-weight="700" fill="#0D2B55">不是“人海战术”，而是“问题出现才请对的人”</text></g>
<g id="idea" data-pptx-bounds="56 216 1168 198"><rect x="56" y="216" width="352" height="198" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="84" y="264" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0D2B55">缺什么，补什么</text><text x="84" y="310" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">发现关键短板才加人</text><text x="84" y="344" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">不为“看起来很热闹”堆角色</text><rect x="464" y="216" width="352" height="198" fill="#0D2B55"/><text x="492" y="264" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#E89A22">每个人，只办一件事</text><text x="492" y="310" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">任务、边界、交付目标明确</text><text x="492" y="344" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">做完回收，不带来额外噪声</text><rect x="872" y="216" width="352" height="198" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="900" y="264" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0D2B55">所有意见，放在一本账里</text><text x="900" y="310" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">相近方案不平均拼凑</text><text x="900" y="344" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">让更有价值的候选胜出</text></g>
<g id="boundary" data-pptx-bounds="56 488 1168 112"><rect x="56" y="488" width="1168" height="112" fill="#0D2B55"/><text x="84" y="532" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#E89A22">项目的工程化做法</text><text x="84" y="570" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">统一调度决定谁加入；角色合同、隔离会话、版本账本和专家评审共同约束过程，避免越做越乱。</text></g>
