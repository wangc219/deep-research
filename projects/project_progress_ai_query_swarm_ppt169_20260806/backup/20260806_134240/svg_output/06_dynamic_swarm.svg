<g id="header" data-pptx-bounds="56 42 1168 104"><text x="56" y="74" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">05 / 动态蜂群</text><text x="56" y="128" font-family="Microsoft YaHei, Arial" font-size="42" font-weight="700" fill="#0D2B55">方案哪里卡住，就临时请哪一类专家来补关键一块</text></g>
<g id="story" data-pptx-bounds="56 206 1168 254"><rect x="56" y="206" width="256" height="254" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="84" y="256" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0D2B55">研究先往前走</text><text x="84" y="302" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">基础团队先完成</text><text x="84" y="334" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">对手、方案、装备、</text><text x="84" y="366" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">证据与验证的基本工作</text><rect x="360" y="206" width="256" height="254" fill="#FFF3E1" stroke="#E89A22" stroke-width="3"/><text x="388" y="256" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#B45F06">发现关键缺口</text><text x="388" y="302" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">证据不够？因果不通？</text><text x="388" y="334" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">装备不具体？对手反应</text><text x="388" y="366" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">或验证办法还没想清？</text><rect x="664" y="206" width="256" height="254" fill="#0D2B55"/><text x="692" y="256" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#E89A22">临时精准增援</text><text x="692" y="302" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">只请最需要的专项顾问</text><text x="692" y="334" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">任务和边界说清楚</text><text x="692" y="366" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">做完就离场，不拖泥带水</text><rect x="968" y="206" width="256" height="254" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="996" y="256" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0D2B55">意见统一记账</text><text x="996" y="302" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">新意见不能悄悄覆盖</text><text x="996" y="334" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">要么合并、要么补充、</text><text x="996" y="366" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">要么按最新结论重做</text></g>
<g id="quality-gain" data-pptx-bounds="56 520 1168 94"><rect x="56" y="520" width="1168" height="94" fill="#0D2B55"/><text x="84" y="558" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#E89A22">质量提升从哪里来？</text><text x="84" y="594" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">不靠一开始多叫人，而是把复杂课题中真正的漏项逐项补上，并把每次修改留下可追溯的来路。</text></g>
<g id="footer" data-pptx-bounds="56 662 1160 34"><text x="56" y="686" font-family="Microsoft YaHei, Arial" font-size="16" fill="#52606D">工程边界：配置 8–16 个实例、最多 6 并发 / 3 波；版本账本、角色合同与专家修复是项目实现的质量控制手段。</text><text x="1194" y="686" font-family="Arial" font-size="16" font-weight="700" fill="#0D2B55">06</text></g>
