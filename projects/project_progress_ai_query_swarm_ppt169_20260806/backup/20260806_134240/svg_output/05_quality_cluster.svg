<g id="story" data-pptx-bounds="56 204 1168 244"><line x1="180" y1="332" x2="1100" y2="332" stroke="#2B78B8" stroke-width="4"/><circle cx="180" cy="332" r="50" fill="#0D2B55"/><circle cx="640" cy="332" r="50" fill="#0D2B55"/><circle cx="1100" cy="332" r="50" fill="#E89A22"/><text x="180" y="340" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#FFFFFF">1</text><text x="640" y="340" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#FFFFFF">2</text><text x="1100" y="340" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#FFFFFF">3</text><text x="180" y="414" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#0D2B55">先提出几个方向</text><text x="180" y="448" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" fill="#52606D">不急着定结论</text><text x="640" y="414" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#0D2B55">分工补证据、挑毛病</text><text x="640" y="448" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" fill="#52606D">检索、红队、可行性、验证各司其职</text><text x="1100" y="414" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#0D2B55">只留下少数好方向</text><text x="1100" y="448" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" fill="#52606D">形成稳定的装备方向初稿</text></g>
<g id="quality-gain" data-pptx-bounds="56 516 1168 98"><rect x="56" y="516" width="1168" height="98" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="84" y="554" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0D2B55">质量提升从哪里来？</text><text x="84" y="590" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">每一轮都做质量检查；没有新增价值就不再加人；失败可以从检查点恢复，所以不会让“人越多、意见越乱”。</text></g>
<g id="footer" data-pptx-bounds="56 662 1160 34"><text x="56" y="686" font-family="Microsoft YaHei, Arial" font-size="16" fill="#52606D">工程边界：最多 12 个实例、3 波、6 并发；通常保留 2–4 条非支配候选。适合快速探索、批量初筛、低预算任务。</text><text x="1194" y="686" font-family="Arial" font-size="16" font-weight="700" fill="#0D2B55">05</text></g>
