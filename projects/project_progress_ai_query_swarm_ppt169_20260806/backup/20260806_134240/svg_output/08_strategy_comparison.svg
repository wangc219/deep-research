<g id="header" data-pptx-bounds="56 42 1168 104"><text x="56" y="74" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">07 / 怎么选策略</text><text x="56" y="128" font-family="Microsoft YaHei, Arial" font-size="42" font-weight="700" fill="#0D2B55">先要方向，选质量集群；要拿正式结论，选动态蜂群</text></g>
<g id="quality-choice" data-pptx-bounds="56 210 532 330"><rect x="56" y="210" width="532" height="330" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="84" y="260" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" fill="#0D2B55">质量集群</text><text x="84" y="302" font-family="Microsoft YaHei, Arial" font-size="23" fill="#2B78B8">适合：先把方向摸清</text><line x1="84" y1="326" x2="560" y2="326" stroke="#2B78B8" stroke-width="3"/><text x="84" y="372" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">像一次快速专家会诊</text><text x="84" y="410" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">用更短时间拿到可比较的方向</text><text x="84" y="448" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">适合探索、初筛、预算受限任务</text><text x="84" y="506" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#E89A22">真实运行：约 10 分钟</text></g>
<g id="dynamic-choice" data-pptx-bounds="692 210 532 330"><rect x="692" y="210" width="532" height="330" fill="#0D2B55"/><text x="720" y="260" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" fill="#E89A22">动态蜂群</text><text x="720" y="302" font-family="Microsoft YaHei, Arial" font-size="23" fill="#EAF0F7">适合：把正式结论守住</text><line x1="720" y1="326" x2="1196" y2="326" stroke="#E89A22" stroke-width="3"/><text x="720" y="372" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">像遇到疑点就精准增援</text><text x="720" y="410" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">把漏项补齐，把相近方案拉开</text><text x="720" y="448" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">适合复杂课题和正式装备需求论证</text><text x="720" y="506" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#E89A22">真实运行：约 31 分钟</text></g>
<g id="proof" data-pptx-bounds="56 584 1168 54"><rect x="56" y="584" width="1168" height="54" fill="#FFF3E1" stroke="#E89A22" stroke-width="2"/><text x="80" y="618" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#B45F06">同一 Query 实测：动态模式最终达到 100% 来源绑定、L1–L3 通过和 approved；多花的时间用于补漏、复核和修复。</text></g>
<g id="footer" data-pptx-bounds="56 662 1160 34"><text x="56" y="686" font-family="Microsoft YaHei, Arial" font-size="16" fill="#52606D">同 Query 真实记录：Quality 576.738 秒 / 16 次调用；Dynamic 1,884.843 秒 / 34 次调用；数字用于策略选择，不外推为一般性能承诺。</text><text x="1194" y="686" font-family="Arial" font-size="16" font-weight="700" fill="#0D2B55">08</text></g>
