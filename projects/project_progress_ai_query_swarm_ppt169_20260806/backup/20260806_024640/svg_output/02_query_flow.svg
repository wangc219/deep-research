<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
<g id="header" data-pptx-bounds="56 42 1168 112">
  <text x="56" y="74" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B78B8">01 / AI QUERY 双模式</text>
  <text x="56" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#0D2B55">AI Query 自动生成不是单一按钮，<tspan x="56" dy="46">而是两种可治理的任务发散模式</tspan></text>
</g>
<g id="topic-mode" data-pptx-bounds="56 190 528 272">
  <rect x="56" y="190" width="528" height="272" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/>
  <text x="84" y="238" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#0D2B55">主题发散</text>
  <text x="84" y="276" font-family="Microsoft YaHei, Arial" font-size="20" fill="#52606D">从一个明确主题，系统展开多角度结构化问题</text>
  <line x1="84" y1="306" x2="552" y2="306" stroke="#2B78B8" stroke-width="3"/>
  <text x="84" y="348" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#18212F">主题 + 研究边界</text>
  <text x="284" y="348" font-family="Arial" font-size="22" font-weight="700" fill="#E89A22">→</text>
  <text x="326" y="348" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#18212F">Worker 生成候选 Query</text>
  <text x="84" y="402" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">适合：已知研究方向的系统展开与人工选择收敛</text>
</g>
<g id="auto-mode" data-pptx-bounds="640 190 584 272">
  <rect x="640" y="190" width="584" height="272" fill="#0D2B55"/>
  <text x="668" y="238" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#E89A22">自动发散</text>
  <text x="668" y="276" font-family="Microsoft YaHei, Arial" font-size="20" fill="#EAF0F7">按已有任务上下文、推荐 Query 或研究缺口补齐问题</text>
  <line x1="668" y1="306" x2="1196" y2="306" stroke="#E89A22" stroke-width="3"/>
  <text x="668" y="348" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#FFFFFF">任务上下文 / 残差</text>
  <text x="898" y="348" font-family="Arial" font-size="22" font-weight="700" fill="#E89A22">→</text>
  <text x="940" y="348" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#FFFFFF">补充 Query</text>
  <text x="668" y="402" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">适合：发现缺口后补齐研究路径，避免问题定义过早固化</text>
</g>
