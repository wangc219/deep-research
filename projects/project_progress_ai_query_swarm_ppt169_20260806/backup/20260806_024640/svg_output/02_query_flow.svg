  <line x1="150" y1="560" x2="1126" y2="560" stroke="#2B78B8" stroke-width="4"/>
  <circle cx="150" cy="560" r="30" fill="#0D2B55"/><circle cx="446" cy="560" r="30" fill="#0D2B55"/><circle cx="758" cy="560" r="30" fill="#0D2B55"/><circle cx="1126" cy="560" r="30" fill="#E89A22"/>
  <text x="150" y="567" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#FFFFFF">1</text><text x="446" y="567" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#FFFFFF">2</text><text x="758" y="567" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#FFFFFF">3</text><text x="1126" y="567" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
  <text x="150" y="616" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" fill="#0D2B55">结构化草稿</text><text x="446" y="616" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" fill="#0D2B55">审核 / 发布 / 归档</text><text x="758" y="616" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0D2B55">/api/v1/query-library</text><text x="1126" y="616" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" fill="#0D2B55">回填任务 + 版本留痕</text>
