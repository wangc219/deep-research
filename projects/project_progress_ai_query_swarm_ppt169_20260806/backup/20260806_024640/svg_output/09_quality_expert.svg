<g id="header" data-pptx-bounds="56 36 1168 120"><text x="56" y="68" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">08 / 质量门与独立评审</text><text x="56" y="106" font-family="Microsoft YaHei, Arial" font-size="39" font-weight="700" fill="#0D2B55">从候选到发布，系统用质量硬门和专家盲评控制正式结论</text><text x="56" y="140" font-family="Microsoft YaHei, Arial" font-size="20" fill="#52606D">“能生成”不等于“可发布”：候选必须经过账本治理、独立盲评、定向修复与 S6 组合检查。</text></g>
