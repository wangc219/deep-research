<g id="judge" data-pptx-bounds="56 370 530 232"><rect x="56" y="370" width="530" height="232" fill="#0D2B55"/><text x="84" y="414" font-family="Arial" font-size="25" font-weight="700" fill="#E89A22">quality_expert_judge</text><text x="84" y="452" font-family="Microsoft YaHei, Arial" font-size="22" fill="#FFFFFF">只读：版本化候选账本 + 有效证据 ID</text><text x="84" y="488" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">八维：领域契合 · 能力落点 · 创新 · 军事价值</text><text x="84" y="522" font-family="Microsoft YaHei, Arial" font-size="20" fill="#FFFFFF">因果 · 可信度 · 工程可行性 · 稳健性</text><text x="84" y="566" font-family="Microsoft YaHei, Arial" font-size="20" fill="#EAF0F7">不读取原始 Agent 会话；只输出结论与淘汰理由</text></g>
<g id="thresholds" data-pptx-bounds="650 370 574 232"><rect x="650" y="370" width="574" height="232" fill="#EAF0F7" stroke="#2B78B8" stroke-width="3"/><text x="678" y="414" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">发布与修复规则</text><text x="678" y="454" font-family="Microsoft YaHei, Arial" font-size="22" fill="#18212F">综合分 ≥ 0.72，关键维度均 ≥ 0.60</text><text x="678" y="490" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">通过：进入非支配组合收敛</text><text x="678" y="524" font-family="Microsoft YaHei, Arial" font-size="20" fill="#18212F">不足：只修复实质缺口，不重跑全链</text><text x="678" y="562" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#B45F06">hard gate：装备具体 · 机制互异 · 来源绑定 · 可证伪路径</text></g>
