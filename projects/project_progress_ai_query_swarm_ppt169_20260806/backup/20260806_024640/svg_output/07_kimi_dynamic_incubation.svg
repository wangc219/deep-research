<g id="header" data-pptx-bounds="56 38 1168 122"><text x="56" y="70" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#2B78B8">06 / 架构思想借鉴</text><text x="56" y="118" font-family="Microsoft YaHei, Arial" font-size="40" font-weight="700" fill="#0D2B55">Kimi K3 式动态孵化思想，被工程化为可控的角色增长机制</text><text x="56" y="152" font-family="Microsoft YaHei, Arial" font-size="20" fill="#52606D">借鉴的是“按任务状态临时生成最有价值能力”的架构思想，不是复刻外部接口或组件。</text></g>
<g id="principles" data-pptx-bounds="56 206 500 346"><rect x="56" y="206" width="500" height="346" fill="#0D2B55"/><text x="84" y="250" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#E89A22">动态孵化的五个原则</text><text x="84" y="300" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#FFFFFF">1　按缺口孵化，不按岗位堆叠</text><text x="84" y="342" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#FFFFFF">2　角色是一次性合同，不是永久成员</text><text x="84" y="384" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#FFFFFF">3　并行探索必须进入统一账本</text><text x="84" y="426" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#FFFFFF">4　让竞争替代平均融合</text><text x="84" y="468" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#FFFFFF">5　增长权交给控制器，而非子 Agent</text><text x="84" y="522" font-family="Microsoft YaHei, Arial" font-size="18" fill="#EAF0F7">目标：避免递归膨胀、上下文污染与并行互相覆盖</text></g>
<g id="mapping" data-pptx-bounds="624 206 600 346"><text x="624" y="240" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">项目中的工程化落地</text><line x1="624" y1="260" x2="1196" y2="260" stroke="#E89A22" stroke-width="4"/><text x="624" y="308" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">残差触发</text><text x="846" y="308" font-family="Microsoft YaHei, Arial" font-size="19" fill="#18212F">证据、因果、装备、适应、验证缺口才触发</text><text x="624" y="358" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">角色合同</text><text x="846" y="358" font-family="Microsoft YaHei, Arial" font-size="19" fill="#18212F">任务、权限、预算、阈值、停止条件明确</text><text x="624" y="408" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">隔离与账本</text><text x="846" y="408" font-family="Microsoft YaHei, Arial" font-size="19" fill="#18212F">独立会话 + Merge Receipt + 版本重基</text><text x="624" y="458" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0D2B55">质量与回收</text><text x="846" y="458" font-family="Microsoft YaHei, Arial" font-size="19" fill="#18212F">专家盲评 + 定向修复 + 有界实例回收</text><text x="624" y="528" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#E89A22">项目实现：winning_swarm_dynamic_v2</text></g>
<g id="footer" data-pptx-bounds="56 662 1160 34"><text x="56" y="686" font-family="Microsoft YaHei, Arial" font-size="16" fill="#52606D">可概括为：Kimi K3 动态孵化思想 = 按状态生成价值最高的能力；项目落地 = 残差触发 + 合同 + 账本 + 评审 + 回收</text><text x="1194" y="686" font-family="Arial" font-size="16" font-weight="700" fill="#0D2B55">07</text></g>
</svg>
