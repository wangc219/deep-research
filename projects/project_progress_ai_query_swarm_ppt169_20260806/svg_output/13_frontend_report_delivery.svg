    <text x="888" y="230" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#E89A22">交付闭环三步</text>
    <line x1="888" y1="252" x2="1196" y2="252" stroke="#E89A22" stroke-width="3"/>
