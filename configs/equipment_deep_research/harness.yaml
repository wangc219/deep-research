skills:
  - skill_id: strategic_osint
    triggers: [战略环境, 联盟格局, 力量态势]
    allowed_tools: [search_sources, fetch_page, create_evidence_card, register_event_timeline, compare_actor_positions]
    steps: [建立来源策略, 登记事件时间线, 比较行为体立场, 形成态势判断]
    required_artifacts: [StrategicAssessment]
    quality_gates: [主要判断至少双源支撑, 时间尺度明确]
    stop_conditions: [态势判断和战略格局完整]
    object_write_scopes: [EvidenceCard, StrategicAssessment, BaselineFindingPacket]
  - skill_id: threat_forecasting
    triggers: [威胁预测, 预警指标]
    allowed_tools: [search_sources, fetch_page, create_evidence_card, register_warning_indicator, test_competing_hypothesis]
    steps: [识别威胁假设, 登记预警指标, 搜索反证, 比较竞争假设]
    required_artifacts: [StrategicAssessment]
    quality_gates: [存在替代假设, 高影响低置信判断显式标注]
    stop_conditions: [预警指标和替代假设完整]
    object_write_scopes: [EvidenceCard, StrategicAssessment, BaselineFindingPacket]
  - skill_id: force_posture_tracking
    triggers: [力量建设, 部署演训, 采购投入]
    allowed_tools: [search_sources, fetch_page, create_evidence_card, register_event_timeline]
    steps: [建立趋势基线, 标记异常变化, 估计能力形成节奏]
    required_artifacts: [StrategicAssessment]
    quality_gates: [来源日期可追溯, 变化与基线可比较]
    stop_conditions: [力量态势与不确定性完整]
    object_write_scopes: [EvidenceCard, StrategicAssessment, BaselineFindingPacket]
  - skill_id: scenario_engineering
    triggers: [场景树, 阶段化场景]
