    stop_conditions: [优先序依赖和不确定性完整]
    object_write_scopes: [WinningKnowledgeProjection]
  - skill_id: ooda_vulnerability_analysis
    triggers: [S1, OODA, 对手薄弱环节]
    allowed_tools: [analyze_ooda_vulnerability, write_reasoning_node, create_recall_request]
    steps: [解释现行制胜范式的成功逻辑与锁定依赖, 解构观察判断决策行动保障恢复, 映射节点依赖, 提出范式失效条件, 识别脆弱性与替代路径, 比较竞争假设]
    required_artifacts: [WinningReasoningNode, RecallRequest]
    quality_gates: [每条种子包含成功逻辑锁定依赖破局条件和反适应, 薄弱环节有依赖依据, 事实推断假设分离, 不输出可执行攻击指令]
    stop_conditions: [S1节点或定向召回完成]
    object_write_scopes: [WinningReasoningNode, RecallRequest]
  - skill_id: doctrine_operational_review
    triggers: [S2, 条令审查, 战法本体]
    allowed_tools: [write_reasoning_node, create_recall_request]
    steps: [建立条令战法基线, 设置非装备与普通升级对照, 还原任务链协同与保障, 比较决策权时序暴露和效应关系, 比较演习实战偏差, 识别失败模式, 形成候选制胜路径]
    required_artifacts: [WinningReasoningNode, RecallRequest]
    quality_gates: [若非装备调整或普通升级可取得同一战果则不牵引新质装备, 战法与场景条件对应, 保障和失败边界完整, 证据不足触发召回]
    stop_conditions: [S2节点或定向召回完成]
    object_write_scopes: [WinningReasoningNode, RecallRequest]
  - skill_id: counterfactual_triz_innovation
    triggers: [S3, 反事实, TRIZ, 突破口]
    allowed_tools: [generate_counterfactual_option, apply_triz_contradiction, write_reasoning_node, create_recall_request]
    steps: [提取核心矛盾, 改变关键前提, 比较最强常规非连续跃迁和流程解释, 应用TRIZ原则生成选项, 执行常规吸收与关系删除测试, 构建效果链, 保留替代方向]
    required_artifacts: [WinningReasoningNode, RecallRequest]
    quality_gates: [传统范式关系跃迁常规不可吸收性和独立性命题齐全, 删除关系跃迁后常规方案不能原样完成制胜链, 突破方向具体可验证, 效果链可追溯, 至少一个替代方向]
    stop_conditions: [S3突破方向效果链与验证建议完整]
    object_write_scopes: [WinningReasoningNode, RecallRequest]
  - skill_id: dotmlpf_capability_mapping
    triggers: [S4, DOTMLPF, 能力任务映射]
    allowed_tools: [map_dotmlpf_requirement, write_reasoning_node, write_stage_output, create_recall_request]
    steps: [效果映射任务, 任务映射能力, 以最小可行装备构型物化关系跃迁, 执行构型删除测试, 区分装备与非装备措施, 定义功能性能约束, 明确体系接口]
    required_artifacts: [WinningReasoningNode, WinningMechanismStageOutput, RecallRequest]
    quality_gates: [删除前沿构型后仍可维持同一制胜链的方向不得作为新研装备, 能力需求不直接跳成型号, DOTMLPF分类完整, 接口和适用边界明确]
    stop_conditions: [S4能力矩阵和L2输入完整]
    object_write_scopes: [WinningReasoningNode, WinningMechanismStageOutput, RecallRequest]
  - skill_id: equipment_system_gap_assessment
    triggers: [S5, 装备基线, 体系效能, 五档差距]
    allowed_tools: [write_reasoning_node, write_stage_output, create_recall_request]
    steps: [建立现役在研基线, 比较参数条件和成熟度, 用最强常规升级和非装备路径复做吸收测试, 裁决新研升级或判退, 纳入体系接口保障约束, 按五档分级, 标记冲突与未知]
    required_artifacts: [WinningReasoningNode, WinningMechanismStageOutput, RecallRequest]
    quality_gates: [传统范式关系跃迁和候选独立性相互对应并通过常规吸收测试, 改名不得替代制胜机理修复, 每项差距有基准, 冲突参数保留, 型号能力不脱离体系]
    stop_conditions: [S5五档差距矩阵完整]
    object_write_scopes: [WinningReasoningNode, WinningMechanismStageOutput, RecallRequest]
  - skill_id: capability_portfolio_synthesis
    triggers: [S6, 能力图像, 需求卡片]
    allowed_tools: [rank_capability_priorities, write_reasoning_node, write_stage_output, create_capability_image, create_recall_request]
    steps: [归并专业研究与S1-S5结果, 保留冲突依赖, 多准则排序, 区分升级与新研, 生成需求卡片和能力全景图, 按A-H分支形成规律场景指标装备形态, 深度撰写能力画像]
    required_artifacts: [WinningKnowledgeProjection, WinningReasoningNode, WinningMechanismStageOutput, CapabilityImageItem]
    quality_gates: [每项追溯到证据和前序节点, 升级新研理由明确, 需求卡片主对象为与query匹配的具体无人导弹弹药或其他战斗装备, 通信算法接口保障不得单独成卡, 能力全景关系完整, 分支定量门槛满足或显式披露缺口]
    stop_conditions: [S6能力组合深度画像分支产物和回溯索引完整]
    object_write_scopes: [WinningKnowledgeProjection, WinningReasoningNode, WinningMechanismStageOutput, CapabilityImageItem, RecallRequest]
  - skill_id: step_quality_critique
    triggers: [内循环, 步骤批判]
    allowed_tools: [evaluate_reasoning_step, create_recall_request]
    steps: [核对输入覆盖, 检查证据越界, 识别跨步跳跃, 检查分支侧重与安全边界, 给出最小重试指引]
    required_artifacts: [RecallRequest]
    quality_gates: [问题具体可修复, 不代替原Agent重写, 召回目标明确]
    stop_conditions: [通过或重试指引完整]
    object_write_scopes: [RecallRequest]
    budget_override: {max_turns: 1, max_tokens: 1200}
  - skill_id: round_causal_critique
    triggers: [中循环, 跨步骤批判]
    allowed_tools: [evaluate_reasoning_round, create_recall_request]
    steps: [检查S1-S6连接, 核对分支侧重, 定位最早失败步骤, 限定重跑范围, 披露剩余不确定性]
    required_artifacts: [RecallRequest]
    quality_gates: [回溯到最早不完整步骤, 重跑范围最小, 循环上限明确]
    stop_conditions: [通过或中循环回溯计划完整]
    object_write_scopes: [RecallRequest]
    budget_override: {max_turns: 1, max_tokens: 1600}
  - skill_id: independent_release_audit
    triggers: [审计, 发布门控]
    allowed_tools: [evaluate_release_readiness, write_audit]
    steps: [检查证据一致性, 检查覆盖置信度和用户确认, 复核循环门控, 识别发布风险, 给出批准或限制建议]
    required_artifacts: [AuditResult]
    quality_gates: [不修改事实不放宽门控, 风险关联对象, 限制条件可执行]
    stop_conditions: [五类判据和发布建议完整]
    object_write_scopes: [AuditResult]
  - skill_id: evidence_based_delivery
    triggers: [报告, 需求卡片, 能力图像交付]
    allowed_tools: [write_report]
    steps: [以原始Query为最高优先级确定军事装备需求主题, 读取前置处理后的少量高价值研判锚点与代表性URL校准事实边界, 围绕对手地域烈度时间窗约束和行动反行动关系发散, 优先识别无人化低空无人机远程精确打击及强打击歼灭压制毁伤方向, 按场景战法能力特征技术攻关能力图像效能贡献三层九项收敛, 披露反证和验证边界]
    required_artifacts: [ResearchReport]
    quality_gates: [不新增数字来源, 不复述或逐项扩写上游锚点, 三层九项齐全且无平行旧模板, 每项关键结论体现深度性创新性前瞻性军事价值性, 能力特征可映射到实现途径核心技术和效能贡献, 预测与事实前提清晰, 能力与限制同等清晰]
    stop_conditions: [三层九项主报告完整且当前分支必需信息已吸收]
    object_write_scopes: [ResearchReport]
  - skill_id: codex_deep_search_shared
    shared: true
    triggers: [DeepSearch, 多源检索, 递归查询扩展]
    allowed_tools: [search_sources, fetch_page, create_evidence_card]
    knowledge_pack_ids: [public_evidence_index, military_knowledge_base, equipment_ontology]
    steps: [把研究问题拆成检索分轨, 优先一手与权威来源, 递归扩展别名时间线和反证查询, 将线索材料化为EvidenceCard]
    required_artifacts: [EvidenceCard]
    quality_gates: [正式结论只引用已材料化证据, 重要判断覆盖多类独立来源, 搜索摘要不直接升级为事实]
    stop_conditions: [主要检索分轨闭合或继续搜索无明显信息增益]
    object_write_scopes: [EvidenceCard]
  - skill_id: codex_deep_research_shared
    shared: true
    triggers: [DeepResearch, 跨源融合, 矛盾检测, 假设生成]
    allowed_tools: [test_competing_hypothesis, build_causal_chain, compare_case_patterns, assess_technology_readiness, compare_equipment_capability]
    knowledge_pack_ids: [military_knowledge_base, doctrine_library, case_library, frontier_technology_library]
    steps: [分离事实推断假设和冲突, 建立竞争假设与证伪条件, 跨源融合并保留少数反证, 形成适用边界与开放问题]
    required_artifacts: [BaselineFindingPacket]
    quality_gates: [结论可追溯, 冲突未被多数意见覆盖, 推断标明前提和置信度]
    stop_conditions: [研究问题得到最小充分回答且剩余未知已登记]
    object_write_scopes: [BaselineFindingPacket]
  - skill_id: codex_evidence_governance_shared
    shared: true
    triggers: [证据治理, 可信度, 反证, 截止日期]
    allowed_tools: [fetch_page, create_evidence_card, reconcile_parameter_conflict, test_competing_hypothesis]
    knowledge_pack_ids: [public_evidence_index, short_term_memory, long_term_memory]
    steps: [核对来源时间与正文位置, 评估直接支持和独立性, 并列保留冲突参数, 将未知和过期信息降级]
    required_artifacts: [EvidenceCard, BaselineFindingPacket]
    quality_gates: [证据ID真实存在, 结论不超出原文支持范围, 截止日期和适用条件明确]
    stop_conditions: [关键主张均有证据或显式假设]
    object_write_scopes: [EvidenceCard, BaselineFindingPacket]
  - skill_id: codex_structured_handoff_shared
    shared: true
    triggers: [结构化交接, Packet, 节点合并, 上下文压缩]
    allowed_tools: [prepare_winning_input, project_winning_resources, write_reasoning_node, create_recall_request]
    knowledge_pack_ids: [short_term_memory, long_term_memory]
    steps: [只传递下游必需字段, 保留证据冲突置信度与开放问题, 指定消费节点和回传契约, 禁止共享原始Agent会话]
    required_artifacts: [BaselineFindingPacket, WinningKnowledgeProjection]
    quality_gates: [交接高信息密度, 输入输出引用完整, 原始会话隔离]
    stop_conditions: [下游可直接消费且无需猜测关键字段]
    object_write_scopes: [BaselineFindingPacket, WinningMechanismInput, WinningKnowledgeProjection, WinningReasoningNode, RecallRequest]
  - skill_id: dynamic_specialist_synthesis
    triggers: [动态子Agent, 专业缺口, OTHER驱动源]
    allowed_tools: [search_sources, fetch_page, create_evidence_card, create_recall_request]
    knowledge_pack_ids: [public_evidence_index, military_knowledge_base, equipment_ontology, doctrine_library, case_library, frontier_technology_library]
    steps: [读取动态角色契约, 只解决指定可分离缺口, 使用绑定知识包和证据索引, 输出对指定S节点的结构化贡献, 达到停止条件后回收]
    required_artifacts: [BaselineFindingPacket, RecallRequest]
    quality_gates: [角色权限不扩张, hypothesis_id与merge_target同时绑定, 引用仅来自有效证据或Packet, 动态实例最多十二个, 禁止递归招募]
    stop_conditions: [专业缺口闭合或预算耗尽并披露限制]
    object_write_scopes: [EvidenceCard, BaselineFindingPacket, RecallRequest]

knowledge_packs:
  - knowledge_pack_id: public_evidence_index
    shared: true
    description: 本次任务已材料化的公开证据索引，是所有正式事实引用的唯一入口。
    source_types: [EvidenceCard, SourceMaterial]
    retrieval_policy: {scope: current_run, access: exact_id_only, raw_session_access: false, freshness_required: true}
    quality_gates: [证据ID存在且正文位置可追溯, 结论不超过直接支持范围]
  - knowledge_pack_id: military_knowledge_base
    shared: true
    description: 军事概念、任务链、能力域和体系关系的受控术语与框架投影。
    source_types: [curated_reference, accepted_packet]
    retrieval_policy: {scope: task_projection, factual_authority: contextual_only, cite_public_evidence_for_claims: true}
    quality_gates: [术语用于分析框架而非替代公开证据, 事实推断和规范性判断分离]
  - knowledge_pack_id: equipment_ontology
    shared: true
    description: 装备型号、批次、任务载荷、参数、体系接口和保障属性的归一化知识投影。
    source_types: [EquipmentObservation, EvidenceCard, accepted_packet]
    retrieval_policy: {scope: current_run_and_curated_index, variant_normalization: required, conflict_preservation: required}
    quality_gates: [型号批次单位和时间条件明确, 冲突参数并列保留]
  - knowledge_pack_id: doctrine_library
    description: 公开条令、作战概念、演习复盘与战法本体的任务级索引。
    source_types: [public_doctrine, exercise_review, EvidenceCard]
    retrieval_policy: {scope: task_projection, access: evidence_linked_summary}
    quality_gates: [条令文本与实际运用分离, 适用场景和版本时间明确]
  - knowledge_pack_id: case_library
    description: 公开战例时间线、关键决策点、因果链、争议事实和迁移边界索引。
    source_types: [case_timeline, EvidenceCard, OperationalSynthesis]
    retrieval_policy: {scope: task_projection, multilingual: true, dispute_preservation: true}
    quality_gates: [事实与事后推断分离, 因果关系包含替代解释, 迁移边界明确]
  - knowledge_pack_id: frontier_technology_library
    description: 前沿技术信号、试验里程碑、TRL、工业约束和潜在颠覆场景索引。
    source_types: [paper, patent, program_record, test_report, EquipmentObservation]
    retrieval_policy: {scope: task_projection, maturity_separate_from_potential: true}
    quality_gates: [技术潜力不等同已形成能力, 成熟度有工程节点依据]
  - knowledge_pack_id: short_term_memory
    shared: true
    description: 当前运行的任务语义卡、蓝图、检查点、结构化Packet和开放问题。
    source_types: [WorkingCheckpoint, BaselineFindingPacket, TraceEvent]
    retrieval_policy: {scope: current_run, raw_session_access: false, compaction: structured_only}
    quality_gates: [只保留可审计结构化状态, 不泄露其他Agent原始会话]
  - knowledge_pack_id: long_term_memory
    shared: true
    description: 经审计接受的历史规律、需求卡片、验证结果与失败模式索引。
    source_types: [accepted_report, validated_capability_card, audited_lesson]
    retrieval_policy: {scope: curated_and_versioned, provenance_required: true, stale_items_must_be_revalidated: true}
    quality_gates: [每条记忆带来源版本和适用边界, 过期内容不得直接作为当前事实]
  - knowledge_pack_id: situation_timeline_library
    description: 国际形势行为体、政策、联盟、部署和预警指标的增量时间线投影。
    source_types: [accepted_packet, EvidenceCard, incremental_memory]
    retrieval_policy: {scope: agent_topic_projection, factual_authority: contextual_only, delta_first: true, revalidation_required: true}
    quality_gates: [历史判断不得替代当前证据, 事件日期和竞争解释保留]
  - knowledge_pack_id: opponent_change_library
    description: 对手采购、部署、演训、条令和能力形成节点的版本化变化基线。
    source_types: [accepted_packet, EvidenceCard, incremental_memory]
    retrieval_policy: {scope: agent_topic_projection, factual_authority: contextual_only, change_detection: true, revalidation_required: true}
    quality_gates: [变化相对基线可追溯, 能力形成与计划声明分离]
  - knowledge_pack_id: scenario_pattern_library
    description: 公开场景约束、关键时间窗、任务链压力点和场景分支模板索引。
    source_types: [accepted_packet, ScenarioModel, EvidenceCard, incremental_memory]
    retrieval_policy: {scope: agent_topic_projection, factual_authority: contextual_only, constraint_projection: true, revalidation_required: true}
    quality_gates: [模板不能替代当前任务约束, 假设和事实分离]
  - knowledge_pack_id: equipment_program_library
    description: 装备型号、批次、项目状态、参数来源、接口和保障边界的增量项目库。
    source_types: [accepted_packet, EquipmentObservation, EvidenceCard, incremental_memory]
    retrieval_policy: {scope: agent_topic_projection, factual_authority: contextual_only, variant_normalization: required, revalidation_required: true}
    quality_gates: [型号批次和日期明确, 冲突参数不得覆盖, 历史参数重新核验]
  - knowledge_pack_id: system_dependency_library
    description: 任务链、信息链、保障链、接口依赖和级联失效模式的版本化图谱投影。
    source_types: [accepted_packet, ScenarioModel, OperationalSynthesis, EvidenceCard, incremental_memory]
    retrieval_policy: {scope: agent_topic_projection, factual_authority: contextual_only, graph_delta: true, revalidation_required: true}
    quality_gates: [依赖关系带适用边界, 体系推演不冒充实测事实]
  - knowledge_pack_id: operational_pattern_library
    description: 条令、战例、COA、协同接口、保障韧性和失败模式的增量运用库。
    source_types: [accepted_packet, OperationalSynthesis, EvidenceCard, incremental_memory]
    retrieval_policy: {scope: agent_topic_projection, factual_authority: contextual_only, coa_comparison: required, revalidation_required: true}
    quality_gates: [条令与实际运用分离, 迁移边界和失败模式保留]
