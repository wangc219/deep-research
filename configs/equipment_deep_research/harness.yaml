    quality_gates: [环境约束映射到能力压力点]
    stop_conditions: [主要环境压力均已覆盖]
    object_write_scopes: [EvidenceCard, ScenarioModel, BaselineFindingPacket]
  - skill_id: adversary_coa_analysis
