    quality_gates: [至少两个场景分支, 每个关键节点有证据或假设]
    stop_conditions: [场景框架和分支完整]
    object_write_scopes: [EvidenceCard, ScenarioModel, BaselineFindingPacket]
  - skill_id: modern_battlespace_analysis
    triggers: [多域, 强电磁, 复杂地形]
