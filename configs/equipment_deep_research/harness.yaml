    stop_conditions: [MissionGraph实例保持16至21, 动态实例不超过21, 6个S3/S4开放创新席位每席完成至少三维比较并按质量提交最多3件、由对应S5并发评分, 波次不超过3, 预计质量增益低于0.03停止招聘, 最终合并S5五项评分选出前7项进入S6并发画像]
    recovery_policy: {resume_from: latest_ledger_version, retry_limit: 1, recursive_recruitment: forbidden, stale_write: rebase}
