default_model: gpt-5.6-sol
agents:
  - agent_id: international_situation
    display_name: 国际形势
    description: 研判国际形势、潜在威胁力量、战略格局和对手动向。
    capability_tags: [situation, threat, strategy]
    tools: [search_sources, fetch_page, create_evidence_card]
    context_policy:
      visible_sections: [task, source_policy, own_checkpoint, recall_request]
      hide_other_agent_raw_sessions: true
    enabled: true
  - agent_id: combat_scenario
    display_name: 作战场景
    description: 构建作战场景框架、敌方方案、关键时间节点和地形环境约束。
    capability_tags: [scenario, coa, environment]
    tools: [search_sources, fetch_page, create_evidence_card]
    context_policy:
      visible_sections: [task, source_policy, own_checkpoint, recall_request]
      hide_other_agent_raw_sessions: true
    enabled: true
  - agent_id: weapon_equipment
    display_name: 武器装备
    description: 分析现有装备参数、在研型号、技术成熟度和能力约束。
    capability_tags: [equipment, capability_gap, technology_readiness]
    tools: [search_sources, fetch_page, create_evidence_card]
    context_policy:
      visible_sections: [task, source_policy, own_checkpoint, recall_request]
      hide_other_agent_raw_sessions: true
    enabled: true
  - agent_id: operational_employment
    display_name: 作战运用
    description: 分析作战约束、兵力协同、COA和经验教训。
    capability_tags: [operation, coordination, lessons]
    tools: [search_sources, fetch_page, create_evidence_card]
    context_policy:
      visible_sections: [task, source_policy, own_checkpoint, recall_request]
      hide_other_agent_raw_sessions: true
    enabled: true
  - agent_id: winning_mechanism
    display_name: 制胜机理
    description: 基于基线发现执行L1/L2/L3制胜机理分析并生成能力画像。
    capability_tags: [winning_mechanism, capability_image]
    tools: [write_stage_output, create_recall_request, create_capability_image]
    context_policy:
      visible_sections: [task, baseline_summaries, evidence_index, coverage, checkpoints]
      hide_other_agent_raw_sessions: true
    enabled: true
  - agent_id: auditor
    display_name: 审计
    description: 审查证据支撑、覆盖限制、门控结果和最终报告状态。
    capability_tags: [audit, evidence_review]
    tools: [write_audit]
    context_policy:
      visible_sections: [task, evidence_index, stage_outputs, capability_images, trace_summary]
      hide_other_agent_raw_sessions: true
    enabled: true
  - agent_id: reporter
    display_name: 报告
    description: 生成甲方可读能力画像报告。
    capability_tags: [report]
    tools: [write_report]
    context_policy:
      visible_sections: [task, evidence_index, capability_images, audit, coverage, trace_summary]
      hide_other_agent_raw_sessions: true
    enabled: true

