use_default_settings:
  engines:
    keep_only:
      - brave
      - brave.news
      - baidu
      - sogou
      - sogou wechat
      - arxiv
      - semantic scholar
      - openairepublications
      - pubmed
      - europepmc
      - reuters
      - github
      - wikipedia
      - wikidata

search:
  safe_search: 0
  default_lang: auto
  formats:
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 3.0
  max_request_timeout: 8.0
  pool_connections: 100
  enable_http2: true

engines:
  - name: wikipedia
    display_type: [infobox, list]
  - name: wikidata
    display_type: [infobox, list]
